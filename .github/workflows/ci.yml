# main에 push하면 테스트를 돌리고, 통과했을 때만 GitHub Pages에 배포한다.
# 배포 단계가 동작하려면 저장소 설정에서 Pages의 Source가 "GitHub Actions"여야 한다.
name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 2026-11-12 20 → 25분(사용자 결정). 11-11 테스트가 17분으로 20분에 가까웠다
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 랭킹 서버 규칙 테스트
        run: node --test 'worker/test/*.test.js'
      - name: 층 검사와 판정 규칙 테스트(js/core)
        run: |
          node scripts/layers.js
          node --test 'tests/core/*.test.mjs'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: 줄인 js로 한 번 더 보기(배포 단계와 똑같이 줄여서 @min 테스트만)
        run: |
          mkdir _min && cp index.html og.png crowd.mp3 _min/ && cp -r js _min/
          node scripts/minify.js _min/js
          WALKOFF_ROOT=_min WALKOFF_PORT=4180 npx playwright test --grep @min
      - name: 실패하면 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci   # js를 줄이는 esbuild(scripts/minify.js)
      - name: 배포할 파일만 모아 js를 줄이고 커밋 번호 넣기
        run: |
          mkdir _site && cp index.html og.png crowd.mp3 _site/
          cp -r js "_site/js-${GITHUB_SHA::7}"   # 게임 모듈은 커밋마다 다른 폴더라, Pages가 10분 캐시하는 동안 옛 index.html과 새 모듈이 섞이지 않는다
          node scripts/minify.js "_site/js-${GITHUB_SHA::7}"   # 주석·빈칸을 빼고 줄인다(파일·import 경로는 그대로, 소스맵 없음)
          sed -i "s|<div id=\"build\">local</div>|<div id=\"build\">${GITHUB_SHA::7}</div>|" _site/index.html
          sed -i "s|\"js/|\"js-${GITHUB_SHA::7}/|g" _site/index.html   # script와 modulepreload 모두
          grep -q "<div id=\"build\">${GITHUB_SHA::7}</div>" _site/index.html
          grep -q "src=\"js-${GITHUB_SHA::7}/main.js\"" _site/index.html
          for f in $(grep -o 'modulepreload" href="[^"]*"' _site/index.html | cut -d'"' -f3); do test -f "_site/$f"; done   # 미리 받는 모듈이 모두 올라갔다
          node scripts/keep-prev.js https://hyunseungbeom.github.io/walkoff/ _site   # 지금 배포된 판의 모듈 폴더도 남긴다(10분 캐시된 옛 index.html이 찾는다)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
