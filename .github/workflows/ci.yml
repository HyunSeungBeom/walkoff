# main에 push하면 테스트를 돌리고, 통과했을 때만 GitHub Pages(옛 주소)와 Cloudflare Pages(새 주소 walkoff.kr, 2026-11-17)에 배포한다.
# 배포 단계가 동작하려면 저장소 설정에서 Pages의 Source가 "GitHub Actions"여야 한다.
# Cloudflare Pages는 레포 비밀값 CLOUDFLARE_API_TOKEN(계정 권한 Cloudflare Pages 편집)·CLOUDFLARE_ACCOUNT_ID와 프로젝트 walkoff가 있어야 하고, 없으면 건너뛴다.
# 테스트를 거치지 않고 올라가는 Cloudflare Pages의 Git 연결 빌드는 쓰지 않는다
name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # 2026-11-23 25 → 35분(사용자 결정). 11-23 테스트가 24분 12초였는데 팀 대항전·대결 시험이 더해진다. 2026-11-12 20 → 25분(11-11 17분)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 랭킹 서버 규칙 테스트
        run: node --test 'worker/test/*.test.js'
      - name: 상태 알림 Worker 테스트(worker/health, 배포는 손으로)
        run: node --test 'worker/health/test/*.test.js'
      - name: 층 검사와 판정 규칙 테스트(js/core)
        run: |
          node scripts/layers.js
          node --test 'tests/core/*.test.mjs'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: 줄인 js로 한 번 더 보기(배포 단계와 똑같이 줄여서 @min 테스트만)
        run: |
          mkdir _min && cp index.html privacy.html og.png crowd.mp3 _min/ && cp -r js _min/
          node scripts/minify.js _min/js
          WALKOFF_ROOT=_min WALKOFF_PORT=4180 npx playwright test --grep @min
      - name: 실패하면 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

  # 배포할 파일을 만들어 묶음 둘(옛 주소 github-pages, 새 주소 cf-site)로 올린다. npm ci로 남의 코드가 도는 잡이라 배포 권한을 주지 않는다.
  # 두 배포 잡은 이 잡만 기다리고 서로는 기다리지 않는다(2026-11-24): 옛 주소는 walkoff.kr로 넘겨 주기만 해서(11-20) 옛 주소 배포가 막혀도 새 주소는 올라가야 한다
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci   # js를 줄이는 esbuild(scripts/minify.js)
      - name: 배포할 파일만 모아 js를 줄이고 커밋 번호 넣기
        run: |
          mkdir _site && cp index.html privacy.html og.png crowd.mp3 _site/
          cp -r js "_site/js-${GITHUB_SHA::7}"   # 게임 모듈은 커밋마다 다른 폴더라, Pages가 10분 캐시하는 동안 옛 index.html과 새 모듈이 섞이지 않는다
          node scripts/minify.js "_site/js-${GITHUB_SHA::7}"   # 주석·빈칸을 빼고 줄인다(파일·import 경로는 그대로, 소스맵 없음)
          sed -i "s|<div id=\"build\">local</div>|<div id=\"build\">${GITHUB_SHA::7}</div>|" _site/index.html
          sed -i "s|\"js/|\"js-${GITHUB_SHA::7}/|g" _site/index.html   # script와 modulepreload 모두
          grep -q "<div id=\"build\">${GITHUB_SHA::7}</div>" _site/index.html
          grep -q "src=\"js-${GITHUB_SHA::7}/main.js\"" _site/index.html
          for f in $(grep -o 'modulepreload" href="[^"]*"' _site/index.html | cut -d'"' -f3); do test -f "_site/$f"; done   # 미리 받는 모듈이 모두 올라갔다
          node scripts/keep-prev.js https://hyunseungbeom.github.io/walkoff/ _site   # 지금 배포된 판의 모듈 폴더도 남긴다(10분 캐시된 옛 index.html이 찾는다)
      - name: 새 주소에 올릴 판(같은 파일에 미리보기 태그는 새 주소, 머리글 규칙만 더함. 주소는 js/infra/site.js)
        run: |
          read -r OLD NEW <<< "$(node -e "import('./js/infra/site.js').then((s) => console.log(s.OLD_SITE, s.NEW_SITE))")"
          cp -r _site _cf
          sed -i "s|content=\"${OLD}|content=\"${NEW}|g" _cf/index.html   # 레포의 태그가 옛 주소일 때(넘기기를 켜기 전이나 끈 뒤)만 바뀐다
          grep -q "<meta property=\"og:url\" content=\"${NEW}\">" _cf/index.html
          grep -q "<meta property=\"og:image\" content=\"${NEW}og.png\">" _cf/index.html
          # 새 주소 머리글(_headers). Cloudflare Pages만 읽는 파일이라 옛 주소(_site)에는 넣지 않는다
          # - 모든 경로에 HSTS(6개월, 하위 도메인 포함): walkoff.kr 기록은 DNS only라(한국 요청이 미국 LAX로 가지 않게, 2026-11-20 사용자) zone의 HSTS 설정이 걸리지 않는다
          # - 모듈 폴더(js-커밋7자리)는 커밋마다 새 이름이라 한 번 받은 파일이 바뀌지 않는다. 1년 캐시해서 다시 온 사람이 모듈 30여 개를 매번 다시 확인하지 않게 한다(2026-11-19 사용자).
          #   index.html은 Pages 기본(max-age=0, 매번 확인)이라 새 판이 바로 보인다
          printf '%s\n' '/*' '  Strict-Transport-Security: max-age=15552000; includeSubDomains' '/js-*' '  Cache-Control: public, max-age=31536000, immutable' > _cf/_headers
      - uses: actions/upload-artifact@v7
        with:
          name: cf-site
          path: _cf
          retention-days: 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # 옛 주소(GitHub Pages)는 앞 잡이 올린 묶음을 배포만 한다(2026-11-24). 올린 잡에서 바로 배포하면 방금 올린 묶음이 목록에 늦게 보이는 일(GitHub 쪽,
  # actions/deploy-pages#451)로 'No artifacts named'가 나고, 그 잡을 다시 돌리면 같은 이름 묶음이 하나 더 올라가 'Multiple artifacts'로 또 막혔다.
  # 잡을 나누면 목록을 읽기까지 몇 초가 지나고, 이 잡만 다시 돌려도 묶음은 하나다. 코드를 받거나 설치하지 않아 배포 권한(id-token)이 있는 잡에서 남의 코드가 안 돈다
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true   # 묶음이 아직 안 보여 실패하면 30초 뒤 한 번 더 한다. 두 번째도 실패하면 잡이 실패한다(그때는 이 잡만 다시 돌린다)
      - name: 첫 배포가 실패하면 30초 기다리기
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # 새 주소(Cloudflare Pages)는 따로 잡에서 올린다(2026-11-18 보안 검토): 옛 주소 배포 권한(id-token)이 없고, 토큰은 올리는 단계에만 준다.
  # 옛 주소 배포와 같이 돈다(2026-11-24 전에는 옛 주소 다음이라 옛 주소가 실패하면 못 올라갔다). 새 주소는 index.html을 매번 다시 확인해서(max-age=0)
  # 10분 캐시 문제는 작지만 앞 판 폴더는 같이 간다(옛 주소에서 읽은 앞 판이라, 옛 주소만 실패한 다음 판에서는 새 주소의 바로 앞 판과 다를 수 있다)
  deploy-cf:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker   # wrangler(worker/package.json에 고정한 판). 설치 스크립트가 토큰을 못 보게 비밀값 없는 단계에서 받는다
      - uses: actions/download-artifact@v8
        with:
          name: cf-site
          path: _cf
      - name: 새 주소(Cloudflare Pages)에 올리기. 비밀값을 넣기 전에는 건너뛴다
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::notice::Cloudflare 비밀값이 없어 새 주소 배포를 건너뛴다"; exit 0; fi
          worker/node_modules/.bin/wrangler pages deploy _cf --project-name walkoff --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}" --commit-dirty=true
