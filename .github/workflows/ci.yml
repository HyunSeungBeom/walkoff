# main에 push하면 테스트를 돌리고, 통과했을 때만 GitHub Pages에 배포한다.
# 배포 단계가 동작하려면 저장소 설정에서 Pages의 Source가 "GitHub Actions"여야 한다.
name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 랭킹 서버 규칙 테스트
        run: node --test 'worker/test/*.test.js'
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: 실패하면 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 배포할 파일만 모으고 커밋 번호 넣기
        run: |
          mkdir _site && cp index.html og.png share-test.html _site/
          sed -i "s|<div id=\"build\">local</div>|<div id=\"build\">${GITHUB_SHA::7}</div>|" _site/index.html
          grep -q "<div id=\"build\">${GITHUB_SHA::7}</div>" _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
