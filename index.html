<script>
'use strict';

// ===== 기본 값 (단위: m, km/h, 초, ms) =====
// 좌표: x는 오른쪽(1루 쪽), y는 위, z는 투수 쪽. 홈플레이트 앞 끝이 z = 0
const RELEASE = { x: -0.55, y: 1.75, z: 17.0 };                    // 우투수가 공을 놓는 곳
const ZONE = { left: -0.25, right: 0.25, bottom: 0.5, top: 1.1 };   // 공 반지름까지 넣은 스트라이크 존
const BALL_R = 0.037;
const FAIR_MS = 90;      // 타이밍 차이가 이 안이면 앞으로 가는 타구
const FOUL_MS = 140;     // 이 안이면 파울, 넘으면 헛스윙
const PERFECT_MS = 15;   // 정타
const REACH_M = 0.2;     // 존 밖으로 이만큼 넘게 빠지면 배트가 닿지 않음

const PITCHES = {
  fastball: { name: '직구',     kmh: [146, 153], brk: { x: 0.02, y: 0.06 },  late: 2.0, la: 4,   color: '#ffffff' },
  slider:   { name: '슬라이더', kmh: [134, 140], brk: { x: 0.32, y: -0.08 }, late: 2.6, la: -3,  color: '#7fd1ff' },
  curve:    { name: '커브',     kmh: [116, 124], brk: { x: 0.16, y: -0.55 }, late: 2.0, la: -6,  color: '#c49bff' },
  change:   { name: '체인지업', kmh: [125, 131], brk: { x: -0.14, y: -0.24 }, late: 2.2, la: -7, color: '#8ef0a8' },
  fork:     { name: '포크',     kmh: [132, 138], brk: { x: 0.0, y: -0.5 },   late: 3.0, la: -14, color: '#ffb86b' },
};

// 실제 150km 직구는 0.4초 남짓이지만 게임에서는 0.75초쯤으로 늦춘다
const flightTime = (kmh) => 112 / kmh;

const POINTS = { hr: 1000, double: 500, single: 300, ball: 100 };
// 10구 모드는 기회 10번. 존 밖 공을 골라내면 그 공은 기회를 쓰지 않는다(기회 +1, 최대 +5)
// 기회 10번. 볼(존 밖 공을 참음)은 기회를 쓰지 않는다(2026-10-29 사용자 결정으로 추가 기회 상한 5번을 없앰).
// 투구 순서는 40개를 미리 만든다. 볼이 30개 넘게 나올 일은 사실상 없고, 다 쓰면 판을 끝낸다
const CHANCES = 10, SEQ_LEN = 40;
const PERFECT_BONUS = 100;
// 연속 홈런(2026-10-30 사용자 결정, 사용자 목소리 '연속 홈런 시 추가점'): 두 번째 연속(백투백)은 +500, 세 번째부터는 +1,000씩.
// 골라낸 볼은 기회를 쓰지 않아서 연속을 끊지 않고, 끝내기 찬스면 보너스도 2배다. 서버(worker/src/pitches.js)도 같은 값으로 점수 상한을 잰다
const hrStreakBonus = (n) => (n >= 3 ? 1000 : n === 2 ? 500 : 0);
// 이번 공 앞으로 이어진 홈런 수. 볼은 건너뛰고, 다른 결과(안타·아웃·파울·헛스윙·루킹 스트라이크)가 나오면 끊긴다
function hrStreakBefore(i) {
  let n = 0;
  for (let j = i - 1; j >= 0; j--) { const kind = game.results[j]?.kind; if (kind === 'ball') continue; if (kind !== 'hr') break; n++; }
  return n;
}

// 외야 담장: 파울라인 쪽 100m, 가운데 122m. spray는 타구 방향(도), 음수가 3루 쪽
const fenceDist = (spray) => 100 + 22 * Math.cos(clamp(spray, -45, 45) * 2 * Math.PI / 180);
const INFIELDERS = [
  { pos: '3루수', a: -33, d: 32 }, { pos: '유격수', a: -13, d: 40 },
  { pos: '2루수', a: 13, d: 40 }, { pos: '1루수', a: 33, d: 32 }, { pos: '투수', a: 0, d: 18 },
];
const OUTFIELDERS = [
  { pos: '좌익수', a: -28, d: 86 }, { pos: '중견수', a: 0, d: 95 }, { pos: '우익수', a: 28, d: 86 },
];

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOut(t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); }
const DEG = Math.PI / 180;

// 마당 좌표(m): x는 1루 쪽(+), z는 홈에서 투수 쪽(+). a는 홈에서 본 각도(도, 음수가 3루 쪽)
const polar = (a, d) => [d * Math.sin(a * DEG), d * Math.cos(a * DEG)];
const MOUND = 18.44, BASE1 = polar(45, 27.43), BASE2 = [0, 38.8], BASE3 = polar(-45, 27.43);
// 페어 타구를 그리고 수비를 움직일 때는 방향을 파울선 안쪽(±43°)으로 자른다. spray가 ±60°까지 나와 페어 땅볼이 파울 지역에 그려졌다. 판정은 그대로
const FAIR_SPRAY = 43;
// 수비수 달리기(초속 m, 빨라지는 시간 상수 초)와 반응 시간(초). 판정(1루 경주)과 그림이 같은 값을 쓴다. 내야수는 투구에 맞춰 반 걸음 나가 있어서 첫발이 조금 빠르다
const FIELD_SPEED = { in: [7, 0.46], out: [8.5, 0.6], p: [6.5, 0.45] }, FIELD_REACT = { in: 0.22, out: 0.3, p: 0.4 };
// 다이빙(그림 FTRACK.dive와 같은 식): 잡기 DIVE_LEAD초 전까지 공 쪽으로 달려가 그 자리에서 박차고 날아, 엉덩이 앞 DIVE_GLOVE m의 글러브가 공에 닿는다.
// 엉덩이가 나는 거리는 그때 빠르기로 DIVE_LEAD초 + 박차는 DIVE_PUSH m(서서 날면 1m, 전력으로 달려오면 3.3m). 전에는 '다이빙하면 2.4m 더'로 쳐서
// 거의 서 있던 수비수가 몸을 날린 자리에서 공까지 5m를 날아야 했다
const DIVE_LEAD = 0.33, DIVE_GLOVE = 1.06, DIVE_PUSH = 1.0;
// 땅볼에 글러브가 닿는 거리(m): 서서 잡을 때는 몸 앞 0.6m, 달려가며 한 손으로 뻗으면 0.95m. 서서 잡으려면 공보다 0.3초 먼저 가 있어야 한다
const SET_REACH = 0.6, RUN_REACH = 0.95, SET_SLACK = 0.3;
// 0에서 출발해 top(1 - e^(-t/tau))로 빨라지는 달리기(주자·수비수 걸음 runTrack과 같은 식)로 t초에 가는 거리와, d m를 가는 시간(멈추지 않고 지나가는 때)
const sprintDist = (t, top, tau) => (t <= 0 ? 0 : top * (t - tau * (1 - Math.exp(-t / tau))));
function sprintTime(d, top, tau) {
  if (d <= 0) return 0;
  let lo = 0, hi = 40;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (top * (m - tau * (1 - Math.exp(-m / tau))) < d) lo = m; else hi = m; }
  return hi;
}
// 땅볼이 굴러가는 길(2026-11-02): 처음 빠르기는 타구 속도에서 내고(덮어 친 공은 느리다) 내야에서는 초속 3m씩, 외야 잔디(40m 너머)에서는 6m씩 준다.
// 공은 홈플레이트 앞 0.3m에서 spray 방향(±43°로 자름)으로 간다
const GROUND_DECEL = 3.0, GRASS_DECEL = 6.0, GRASS_AT = 40;
function groundPath(r) {
  const a = clamp(r.spray, -FAIR_SPRAY, FAIR_SPRAY) * DEG, dir = [Math.sin(a), Math.cos(a)];
  const u0 = Math.max(4, (r.ev - 45) * 0.38) * (r.la < 0 ? Math.max(0.6, 1 + r.la / 40) : 1);
  // 내야 구간: 감속 3m/s². GRASS_AT m에 닿으면 그때 빠르기로 외야 구간(감속 6m/s²)을 이어 간다
  const tIn = u0 * u0 / (2 * GROUND_DECEL) <= GRASS_AT ? Infinity : (u0 - Math.sqrt(u0 * u0 - 2 * GROUND_DECEL * GRASS_AT)) / GROUND_DECEL;
  const uIn = Number.isFinite(tIn) ? u0 - GROUND_DECEL * tIn : 0;
  const tStop = Number.isFinite(tIn) ? tIn + uIn / GRASS_DECEL : u0 / GROUND_DECEL;
  const dist = (t) => {
    const k = Math.min(t, tStop);
    if (k <= tIn) return u0 * k - 0.5 * GROUND_DECEL * k * k;
    const q = k - tIn;
    return GRASS_AT + uIn * q - 0.5 * GRASS_DECEL * q * q;
  };
  const speed = (t) => (t >= tStop ? 0 : t <= tIn ? u0 - GROUND_DECEL * t : uIn - GRASS_DECEL * (t - tIn));
  return { dir, u0, tStop, dist, speed, pos: (t) => { const s = dist(t); return [dir[0] * s, 0.3 + dir[1] * s]; } };
}
// 수비수가 굴러오는 땅볼에 닿는 첫 때와 자리. reach는 몸에서 글러브가 닿는 거리, slack은 공보다 먼저 가 있어야 하는 때(서서 잡기),
// 공이 홈에서 maxDepth m보다 멀어지면 더 쫓지 않는다(내야수가 외야 잔디까지 쫓아가 잡지 않게). 못 닿으면 null. 1/120초 간격으로 찾는다
function reachGround(path, home, react, top, tau, reach, slack = 0, maxDepth = Infinity, until = path.tStop + 2) {
  for (let i = 0, t = 0; t <= until; i++, t = i / 120) {
    const b = path.pos(t);
    if (Math.hypot(b[0], b[1]) > maxDepth) return null;
    if (Math.hypot(b[0] - home[0], b[1] - home[1]) - reach <= sprintDist(t - react - slack, top, tau)) return { t, at: b };
  }
  return null;
}
// 다이빙으로 땅볼에 닿고도 남는 거리(음수면 닿는다): t초에 잡으려면 DIVE_LEAD초 전까지 달린 자리에서 날아야 한다
function diveShort(b, home, t, react, top, tau) {
  const tl = t - DIVE_LEAD - react, vL = tl > 0 ? top * (1 - Math.exp(-tl / tau)) : 0;
  return Math.hypot(b[0] - home[0], b[1] - home[1]) - DIVE_GLOVE - vL * DIVE_LEAD - DIVE_PUSH - sprintDist(tl, top, tau);
}
function reachDive(path, home, react, top, tau, maxDepth = Infinity, until = path.tStop + 2) {
  for (let i = 0, t = 0; t <= until; i++, t = i / 120) {
    const b = path.pos(t);
    if (Math.hypot(b[0], b[1]) > maxDepth) return null;
    if (diveShort(b, home, t, react, top, tau) <= 0) return { t, at: b };
  }
  return null;
}
// 달려가 닿는 첫 때(std), 못 닿으면 다이빙(dive), 그래도 못 닿으면 가장 가까이 가는 때에 다이빙(forced)
function interceptGround(path, home, react, top, tau, until = path.tStop + 2) {
  const run = reachGround(path, home, react, top, tau, RUN_REACH, 0, Infinity, until);
  if (run) return { ...run, how: 'std' };
  const dive = reachDive(path, home, react, top, tau, Infinity, until);
  if (dive) return { ...dive, how: 'dive' };
  let best = null;
  for (let i = 0, t = 0; t <= until; i++, t = i / 120) { const short = diveShort(path.pos(t), home, t, react, top, tau); if (!best || short < best.short) best = { t, short }; }
  return { t: best.t, at: path.pos(best.t), how: 'forced' };
}

function hasBatchim(word) {
  const c = word.charCodeAt(word.length - 1) - 0xac00;
  return c >= 0 && c <= 11171 && c % 28 !== 0;
}
const eun = (word) => word + (hasBatchim(word) ? '은' : '는');

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pickWeighted(rnd, weights) {
  const keys = Object.keys(weights);
  let r = rnd() * keys.reduce((s, k) => s + weights[k], 0);
  for (const k of keys) { r -= weights[k]; if (r <= 0) return k; }
  return keys[keys.length - 1];
}

const PITCH_MIX = { fastball: 3, slider: 2, curve: 1.5, change: 2, fork: 1.5 };

// 공 하나. inZone 확률로 존 안에 넣고, 빠질 때는 구종마다 빠지는 쪽이 다르다(우투수 기준)
function makePitch(rnd, type, inZone, extra = {}) {
  const def = PITCHES[type];
  const kmh = Math.round(lerp(def.kmh[0], def.kmh[1], rnd()));
  let tx, ty;
  if (rnd() < inZone) {
    tx = lerp(-0.2, 0.2, rnd()); ty = lerp(0.58, 1.02, rnd());
  } else if (type === 'slider') {
    tx = lerp(0.33, 0.5, rnd()); ty = lerp(0.45, 0.95, rnd());        // 우타자 바깥으로 빠짐
  } else if (type === 'fastball') {
    if (rnd() < 0.6) { tx = lerp(-0.2, 0.2, rnd()); ty = lerp(1.17, 1.32, rnd()); }  // 높게
    else { tx = lerp(-0.5, -0.33, rnd()); ty = lerp(0.6, 1.0, rnd()); }            // 우타자 몸쪽
  } else {
    tx = lerp(-0.22, 0.22, rnd()); ty = lerp(0.2, 0.42, rnd());       // 떨어지는 공은 낮게 빠짐
  }
  return { type, kmh, tx: extra.lefty ? -tx : tx, ty, T: flightTime(kmh), ...extra };   // 좌투수는 좌우가 뒤집힌다
}

// 10구 흐름: 1~2구는 직구로 감을 잡고, 3구부터 변화구를 섞는다
function makeSequence(seed, lefty = false) {
  const rnd = mulberry32(seed);
  // 볼을 골라내면 기회가 늘어서 공을 SEQ_LEN개 미리 만든다. 같은 시드면 n번째 공은 누구에게나 같고, 길이를 늘려도 앞의 공은 그대로다
  return Array.from({ length: SEQ_LEN }, (_, i) => {
    const type = i < 2 ? 'fastball' : i === 2 ? (rnd() < 0.5 ? 'fastball' : 'slider') : pickWeighted(rnd, PITCH_MIX);
    return makePitch(rnd, type, i < 3 ? 0.8 : 0.6, { n: i + 1, lefty });
  });
}

// 판마다 상대 투수의 손. 좌완이 35%다. 공 순서와 다른 난수를 써서 순서는 그대로 둔다
const pitcherHand = (seed) => (mulberry32((seed ^ 0x9e3779b9) >>> 0)() < 0.35 ? 'L' : 'R');

// u: 0(놓는 순간)~1(홈플레이트 앞). 휘는 양이 u의 거듭제곱이라 끝에서 크게 휜다. 좌투수는 놓는 곳과 휘는 쪽이 반대다
function ballPos(p, u) {
  const def = PITCHES[p.type], hs = p.lefty ? -1 : 1, rx = RELEASE.x * hs, bx = def.brk.x * hs, by = def.brk.y;
  const k = Math.pow(Math.max(u, 0), def.late);
  return {
    x: rx + (p.tx - bx - rx) * u + bx * k,
    y: RELEASE.y + (p.ty - by - RELEASE.y) * u + by * k,
    z: RELEASE.z * (1 - u),
  };
}

// 좌타자는 좌투수를 상대할 일이 드물어서 공이 늦게 보인다(좌타 대 좌완에만 적용. 우타 대 우완은 흔해서 익숙하다)
const hardMatchup = (p) => !!p.lefty && settings.bats === 'L';

function zoneMiss(p) {
  return Math.max(ZONE.left - p.tx, p.tx - ZONE.right, ZONE.bottom - p.ty, p.ty - ZONE.top, 0);
}
// 존에서 어느 쪽으로 몇 cm 빠졌는지(공 가장자리와 존 사이). 우타자는 몸쪽이 왼쪽(-x), 좌타자는 오른쪽이다.
// 판정은 그대로 두고, '걸쳐 보였는데 볼' 같은 공이 실제로 얼마나 빠졌는지 숫자로 알려 준다(2026-10-30)
function zoneOff(p, bats = settings.bats) {
  const sides = [['아래', ZONE.bottom - p.ty], ['위', p.ty - ZONE.top], [bats === 'L' ? '바깥쪽' : '몸쪽', ZONE.left - p.tx], [bats === 'L' ? '몸쪽' : '바깥쪽', p.tx - ZONE.right]];
  const [dir, m] = sides.reduce((a, b) => (b[1] > a[1] ? b : a));
  return { dir, cm: Math.max(1, Math.round(m * 100)) };
}
const offText = (p, bats) => { const o = zoneOff(p, bats); return `존 ${o.dir}${/[래위]$/.test(o.dir) ? '로' : '으로'} ${o.cm}cm`; };

// 발사각별 비거리 비율. 공기 저항 때문에 30도 근처에서 가장 멀리 간다
const CARRY_BY_LA = [[0, 0], [5, 0.25], [10, 0.45], [15, 0.62], [20, 0.8], [25, 0.93], [30, 1], [35, 0.97],
  [40, 0.9], [45, 0.8], [50, 0.68], [60, 0.5], [70, 0.32], [80, 0.15], [90, 0]];

function carry(ev, la) {
  if (la <= 0) return 0;
  let g = 0;
  for (let i = 1; i < CARRY_BY_LA.length; i++) {
    const [a0, g0] = CARRY_BY_LA[i - 1], [a1, g1] = CARRY_BY_LA[i];
    if (la <= a1) { g = lerp(g0, g1, (la - a0) / (a1 - a0)); break; }
  }
  return Math.max(0, 1.07 * ev - 54) * g;   // 177km/h·30도면 135m쯤
}

function nearest(list, spray) {
  return list.reduce((best, f) => (Math.abs(f.a - spray) < Math.abs(best.a - spray) ? f : best));
}

function fieldArea(spray) {
  if (spray < -20) return '좌';
  if (spray < -8) return '좌중';
  if (spray <= 8) return '중';
  if (spray <= 20) return '우중';
  return '우';
}

// 스윙 판정. dt는 스윙 시각 - 공 도착 시각(ms), 음수면 빠름. 무작위 없이 계산한다
function judgeSwing(p, dt, bats = 'R') {
  const def = PITCHES[p.type];
  const miss = zoneMiss(p);
  const adt = Math.abs(dt);
  const slowBall = p.type === 'curve' || p.type === 'change';
  const r = { kind: 'whiff', name: '헛스윙', hit: false, points: 0, dt, ev: 0, la: 0, spray: 0, dist: 0, reason: '', perfect: false, bats };

  if (miss > REACH_M) { r.reason = `${offText(p, bats)} 빠진 공이었어요`; return r; }
  if (adt > FOUL_MS) {
    r.reason = dt < 0 ? (slowBall ? `${eun(def.name)} 느려요. 더 기다렸다 치세요` : '너무 빨리 휘둘렀어요') : '너무 늦게 휘둘렀어요';
    return r;
  }

  const tq = 1 - Math.pow(Math.min(adt, FAIR_MS) / FAIR_MS, 1.6);
  const reach = 1 - miss / REACH_M;
  const q = tq * (0.35 + 0.65 * reach);
  r.ev = Math.round(75 + 100 * Math.pow(q, 1.2) + (p.kmh - 135) * 0.25);
  r.la = Math.round(24 + (p.ty - 0.8) * 40 + def.la + dt * 0.2);     // 높은 공은 뜨고, 빠르면 덮어 친다
  // 빠르면 당겨치고 늦으면 밀어친다. 당기는 쪽이 우타는 3루 쪽(음수), 좌타는 1루 쪽(양수)
  const side = bats === 'L' ? -1 : 1;
  r.spray = Math.round(side * dt / FAIR_MS * 42 + p.tx * 40);

  if (adt > FAIR_MS) {
    r.kind = 'foul'; r.name = '파울'; r.type = 'foul';
    r.ev = Math.round(95 + (FOUL_MS - adt) * 0.8);
    r.la = clamp(r.la, -5, 55);
    r.spray = side * Math.sign(dt) * Math.round(48 + (adt - FAIR_MS) * 0.4);
    r.dist = Math.max(20, carry(r.ev, Math.max(r.la, 15)));
    r.reason = dt < 0 ? (slowBall ? `${eun(def.name)} 느려요. 조금 더 기다리세요` : '빨라서 당겨친 파울') : '늦어서 밀린 파울';
    return r;
  }

  r.perfect = adt <= PERFECT_MS && miss === 0;
  r.dist = carry(r.ev, r.la);
  classify(r, p, miss);
  if (r.perfect && r.kind === 'out') throughGap(r, p, miss);
  if (r.kind === 'out' && r.type === 'ground') settleAtFirst(r, bats);   // 1루 경주: 늦으면 내야 안타
  return r;
}

// 정타는 아웃이 되지 않는다(2026-10-30 사용자 결정, 사용자 목소리 '정타를 쳤는데 아웃'). 정타는 타이밍이 맞아 가운데로 가는데
// 가운데에는 중견수가 있고 담장도 가장 멀어서, 존 안 정타의 28%가 중견수 직선타·담장 앞 뜬공으로 잡혔다(같은 공을 30ms 늦게 치면 2루타였다).
// 잡힐 정타만 가장 가까운 수비 빈틈으로 보내 다시 판정한다. 빈틈은 수비 위치의 가운데: 땅볼은 3유간·투수 옆·1·2루간, 뜬 타구는 좌중간·우중간
const between = (list) => list.slice(1).map((f, i) => (list[i].a + f.a) / 2);
const GAPS = { ground: between(INFIELDERS.slice(0, 4)), air: between(OUTFIELDERS) };
function throughGap(r, p, miss) {
  const gaps = r.type === 'ground' ? GAPS.ground : GAPS.air;
  r.spray = gaps.reduce((best, g) => (Math.abs(g - r.spray) < Math.abs(best - r.spray) ? g : best));
  Object.assign(r, { dist: carry(r.ev, r.la), fielder: undefined, gap: undefined, wall: undefined, split: true });
  classify(r, p, miss);
}

function classify(r, p, miss) {
  const s = r.spray, ev = r.ev, la = r.la;
  const area = fieldArea(s);
  const single = () => {
    r.kind = 'single'; r.hit = true;
    r.name = area.startsWith('좌') ? '좌전 안타' : area.startsWith('우') ? '우전 안타' : '중전 안타';
  };
  const double = () => {
    r.kind = 'double'; r.hit = true;
    r.name = s < -35 ? '좌익선상 2루타' : s < -8 ? '좌중간 2루타' : s <= 8 ? '중월 2루타' : s <= 35 ? '우중간 2루타' : '우익선상 2루타';
  };
  const homeRun = () => { r.kind = 'hr'; r.hit = true; r.name = `${area}월 홈런`; };
  const outBy = (f, what) => { r.kind = 'out'; r.name = `${f.pos} ${what}`; r.fielder = f; };
  const infield4 = INFIELDERS.slice(0, 4);

  if (la < 8) {
    r.type = 'ground';
    const fielders = ev < 110 ? INFIELDERS : infield4;          // 느린 땅볼은 투수도 잡는다
    const cover = 7 + 8 * clamp((150 - ev) / 60, 0, 1);         // 느릴수록 수비가 따라간다
    const f = nearest(fielders, s);
    if (Math.abs(f.a - s) <= cover || ev < 85) { outBy(f, '땅볼'); r.dist = f.d; }
    else if (Math.abs(s) > 33 && ev >= 140) { double(); r.dist = 78; }
    else { single(); r.dist = 62; r.gap = s < -13 ? '3유간' : s > 13 ? '1·2루간' : '투수 옆'; }
  } else if (la < 22) {
    r.type = 'line';
    const fi = nearest(infield4, s), fo = nearest(OUTFIELDERS, s);
    if (r.dist < 28) { if (Math.abs(fi.a - s) <= 7) outBy(fi, '직선타'); else single(); }
    else if (r.dist >= fenceDist(s)) homeRun();
    else if (Math.abs(fo.a - s) <= 7 && r.dist > 55 && r.dist < 98) outBy(fo, '직선타');
    else if (r.dist >= 82) double();
    else single();
  } else if (la < 50) {
    r.type = 'fly';
    const fence = fenceDist(s), fo = nearest(OUTFIELDERS, s);
    if (r.dist >= fence) homeRun();
    else if (r.dist >= fence - 6) { double(); r.wall = true; }
    else if (r.dist < 38) outBy(nearest(infield4, s), '뜬공');
    else if (r.dist < 58) single();                                // 내야와 외야 사이에 떨어진다
    else if (Math.abs(fo.a - s) > 10 && r.dist >= 80) double();    // 외야수 사이를 가른다
    else outBy(fo, '뜬공');
  } else {
    r.type = 'pop';
    outBy(nearest(infield4, s), '뜬공');
    r.dist = Math.min(r.dist, 30);
  }
  r.points = POINTS[r.kind] || 0;
  r.reason = reasonFor(r, p, miss);
}

function reasonFor(r, p, miss) {
  if (r.kind === 'hr') return r.perfect ? '완벽한 타이밍이에요' : `${Math.round(r.dist)}m 날아갔어요`;
  if (r.split) return '정타라 수비 사이로 빠졌어요';
  if (miss > 0) return `${offText(p)} 빠진 공이라 힘이 덜 실렸어요`;
  if (p.type === 'fork' && r.type === 'ground') return '포크는 끝에서 떨어져서 공 윗부분을 치기 쉬워요';
  if (r.wall) return '조금만 더 갔으면 홈런이었어요';
  if (p.ty > 1.0 && (r.type === 'fly' || r.type === 'pop')) return '높은 공은 뜨기 쉬워요';
  if (p.ty < 0.65 && r.type === 'ground') return '낮은 공은 땅볼이 되기 쉬워요';
  if (r.gap) return `${r.gap}을 빠져나갔어요`;
  if (Math.abs(r.dt) <= PERFECT_MS) return '타이밍은 완벽했어요';
  return r.dt > 0 ? '늦어서 밀어친 타구예요' : '빨라서 당겨친 타구예요';
}

function judgeTake(p) {
  return zoneMiss(p) === 0
    ? { kind: 'strike', name: '루킹 스트라이크', points: 0, reason: '존에 들어온 공이었어요', took: true }
    : { kind: 'ball', name: '볼', points: POINTS.ball, reason: `${offText(p)} 빠졌어요 · 선구안 보너스`, took: true };
}

// ===== 1루 경주(2026-11-02 사용자 '간발의 승부', 판정이 바뀐다) =====
// 땅볼 아웃으로 판정된 공을 수비수가 잡아 던진 공이 1루에 닿는 때와, 친 타자가 1루를 밟는 때를 견줘 늦으면 내야 안타로 바꾼다.
// 무작위 없이 ev·la·spray·수비수·타석만 쓰고 화면(폰 그림 이동 등)은 쓰지 않아 PC·폰이 같다. 그림(fieldPlay)도 이 시각을 그대로 쓴다.
// 정타는 이미 수비 사이로 빠져(throughGap) 여기 오지 않는다. 서버는 바꾸지 않는다(내야 안타도 배트가 닿은 공이라 초록불을 받는다)
// 친 뒤 주자가 1루를 밟는 때(초). 우타는 스윙한 힘이 3루 쪽으로 쏠려 타석에서 늦게 나오고 좌타는 1루 쪽이라 빠르다. 그림은 출발 시각으로 맞춘다(runStartOf).
// 우타의 땅볼은 3루·유격 쪽(먼 송구)으로, 좌타는 1·2루 쪽(짧은 송구, 1루수가 직접 밟기)으로 많이 가서 둘의 차이를 실제(0.1초쯤)보다 크게 두어 내야 안타가 한쪽으로 쏠리지 않게 했다
const RUN_TO_1B = { R: 4.7, L: 4.2 };
// 땅볼을 잡는 방법(2026-11-02 사용자 '러닝 스로가 더 빠르다, 몸을 날리는 건 1·2루간·3유간으로 가는 어려운 공만'):
//  set   공 길에 먼저 가서 서서 잡고 한 발 내디뎌 던진다(정면 땅볼)
//  run   달려가며 한 손으로 잡아 멈추지 않고 던진다(러닝 스로). 앞으로 달려 나오거나(charge) 1루 쪽으로 몸이 가는 공
//  plant 1루 반대쪽으로 달려가며 잡아(백핸드·2루 쪽) 발을 디뎌 멈추고 던진다
//  dive  달려도 글러브가 안 닿아 몸을 날려 잡고 일어나 던진다
// 서서 잡아도 주자보다 0.3초 넘게 먼저 닿으면 서서 잡고, 아니면 1루에 가장 빨리 닿는 방법을 고른다. 다이빙은 달려서는 안 닿는 공뿐이다.
// 전에는 늘 가장 일찍 닿는 자리에서 잡게 하고 잡은 뒤 1.45초를 들고 있다 던져서, 그림이 땅볼의 86%를 다이빙으로 그렸다
// 잡아서 공을 놓기까지(초, 서서 잡기)와 1루까지 평균 송구 빠르기(m/s). run·plant·dive는 PLAY_EX(초)와 PLAY_SPEED(빠르기 배수)를 쓴다.
// 1루수는 잡고 공을 챙겨 1루로 뛰거나 토스하기까지. 분석 스크립트(scripts/outcomes.js)로 맞춘 값이다
const EXCHANGE = { '3루수': 0.95, '유격수': 0.95, '2루수': 0.9, '1루수': 0.4, '투수': 1.0 };
const THROW_SPEED = { '3루수': 30, '유격수': 29, '2루수': 25, '투수': 25 };
const PLAY_EX = { run: 0.75, plant: 1.25, dive: 2.0 }, PLAY_SPEED = { run: 0.85, plant: 0.92, dive: 0.78 };
const fieldHome = (f) => (f.pos === '투수' ? [0, MOUND - 1.5] : polar(f.a, f.d));   // 투수는 공을 던진 뒤 마운드 앞 수비 자세 자리
// 투수가 1루 커버를 가는 길: 마운드 앞에서 1루 4m 앞 선 안쪽(0.6m)으로 달려가 선을 따라 베이스 안쪽을 밟는다(꺾이는 곳은 둥글게).
// 1루수가 멀리 잡으면 이 길을 뛰는 투수에게 토스하고, 투수는 베이스 1m 앞(TOSS_STEP초 앞)에서 받아 밟는다
const PCOVER = (() => {
  const at = (d, o) => [BASE1[0] - Math.SQRT1_2 * (d + o), BASE1[1] - Math.SQRT1_2 * (d - o)];   // 1루에서 홈 쪽 선을 따라 d, 선 안쪽(내야 쪽)으로 o
  const a = [0, MOUND - 1.5], c = at(4, 0.6), k = 2 / Math.hypot(c[0] - a[0], c[1] - a[1]), c0 = [c[0] + (a[0] - c[0]) * k, c[1] + (a[1] - c[1]) * k], c1 = at(2, 0.4), pts = [a];
  for (let i = 0; i <= 8; i++) { const s = i / 8; pts.push([0, 1].map((j) => (1 - s) * (1 - s) * c0[j] + 2 * (1 - s) * s * c[j] + s * s * c1[j])); }
  pts.push(at(0, 0.3));
  return pts;
})();
const PCOVER_LEN = PCOVER.slice(1).reduce((sum, q, i) => sum + Math.hypot(q[0] - PCOVER[i][0], q[1] - PCOVER[i][1]), 0), TOSS_STEP = 0.12;
// 친 타자가 출발점(타석)에서 at까지 가는 때. 1루를 밟는 때(RUN_TO_1B)에 맞춘 SPRINT 걸음 비율로 센다(1루수 태그용)
function runnerTimeAt(at, bats) {
  const start = [(bats === 'L' ? 1 : -1) * 1.0, 0.3], full = sprintTime(Math.hypot(BASE1[0] - start[0], BASE1[1] - start[1]), 8.3, 0.8);
  return 0.28 + sprintTime(Math.hypot(at[0] - start[0], at[1] - start[1]), 8.3, 0.8) * (RUN_TO_1B[bats === 'L' ? 'L' : 'R'] - 0.28) / full;
}
function settleAtFirst(r, bats) {
  const path = groundPath(r);
  // 홈 12m 안에서 멈추는 빗맞은 공은 투수가 달려 나와 잡는다(실제로는 포수·투수 공이다. 3루수가 25m를 달려와 잡으면 늘 내야 안타였다)
  if (path.dist(path.tStop) < 12 && r.fielder.pos !== '투수') { r.fielder = INFIELDERS.find((x) => x.pos === '투수'); r.name = '투수 땅볼'; }
  const race = computeRace(r, bats);
  r.race = race;
  if (race.safe) {
    Object.assign(r, { kind: 'single', hit: true, infield: true, name: `${race.pos} 내야 안타`, points: POINTS.single });
    r.reason = !race.arrive ? '느린 타구라 던질 틈이 없었어요' : `${race.how === 'dive' ? '몸을 날려 잡았지만 ' : ''}1루에 ${(-race.margin).toFixed(2)}초 먼저 닿았어요`;
  } else if (race.margin < 0.15) r.reason = `간발의 차로 아웃 · ${race.margin.toFixed(2)}초`;
}
// 1루 경주를 잰다(r는 바꾸지 않는다). 그림(fieldPlay)이 판정 없이 만든 시험용 결과에도 쓴다
function computeRace(r, bats) {
  const path = groundPath(r);
  const f = r.fielder, pos = f.pos, isP = pos === '투수', [top, tau] = isP ? FIELD_SPEED.p : FIELD_SPEED.in, react = isP ? FIELD_REACT.p : FIELD_REACT.in;
  const home = fieldHome(f), hd = Math.hypot(home[0], home[1]), runner = RUN_TO_1B[bats === 'L' ? 'L' : 'R'];
  const toB1 = (at) => Math.hypot(at[0] - BASE1[0], at[1] - BASE1[1]), lane = (at) => Math.abs(at[0] - at[1]) / Math.SQRT2;   // lane: 1루선(주자 길목)에서 떨어진 거리
  // 잡는 방법마다 잡는 때·자리. 다이빙은 달려서 안 닿을 때만 본다. 수비 자리보다 5m 넘게 뒤(외야 쪽)로는 쫓지 않는다
  const cands = [], maxD = hd + 5;
  const set = reachGround(path, home, react, top, tau, SET_REACH, SET_SLACK, maxD);
  if (set) cands.push({ how: 'set', ...set });
  const run = reachGround(path, home, react, top, tau, RUN_REACH, 0, maxD);
  if (run) {
    const m = Math.hypot(run.at[0] - home[0], run.at[1] - home[1]), u = m > 0.01 ? [(run.at[0] - home[0]) / m, (run.at[1] - home[1]) / m] : [-home[0] / hd, -home[1] / hd];
    const d1 = toB1(run.at), w = [(BASE1[0] - run.at[0]) / d1, (BASE1[1] - run.at[1]) / d1], charge = -(u[0] * home[0] + u[1] * home[1]) / hd;   // charge: 홈 쪽으로 달려 나온 정도
    // 1루 반대쪽으로 몸이 가면(유격수·3루수의 백핸드, 2루수의 2루 쪽) 발을 디뎌 멈추고 던진다. 달려 나오거나 1루 쪽으로 가면 그대로 던진다
    cands.push({ how: charge < 0.5 && u[0] * w[0] + u[1] * w[1] < -0.25 ? 'plant' : 'run', charge: charge >= 0.5, ...run });
  } else {
    const dive = reachDive(path, home, react, top, tau, maxD);
    if (dive) cands.push({ how: 'dive', ...dive });
  }
  if (!cands.length) { const ic = interceptGround(path, home, react, top, tau); cands.push({ how: 'dive', forced: true, t: ic.t, at: ic.at }); }
  // 잡은 뒤 공이 1루에 닿는 때(1루수는 직접 밟거나 투수에게 토스하거나 오는 주자를 태그한다)
  const finish = (c) => {
    if (pos === '1루수') {
      if (c.how !== 'dive' && lane(c.at) < 2.5 && c.t + 0.3 <= runnerTimeAt(c.at, bats)) return { release: c.t, arrive: c.t + 0.3, to: 'tag' };   // 주자 길목에서 먼저 잡으면 오는 주자를 태그한다
      const gather = c.how === 'dive' ? 1.0 : EXCHANGE[pos], d = toB1(c.at), self = c.t + gather + sprintTime(Math.max(0, d - 0.5), top, tau);
      const flight = clamp(d / 12, 0.3, 0.6), toss = Math.max(FIELD_REACT.p + sprintTime(PCOVER_LEN, ...FIELD_SPEED.p), c.t + gather + flight + TOSS_STEP);
      if (self <= toss || d < 8) return { release: c.t + gather, arrive: self, to: 'self' };   // 베이스가 가까우면 직접 밟는다
      return { release: toss - TOSS_STEP - flight, arrive: toss, to: 'P' };
    }
    const ex = c.how === 'set' ? EXCHANGE[pos] : PLAY_EX[c.how], speed = THROW_SPEED[pos] * (c.how === 'set' ? 1 : PLAY_SPEED[c.how]);
    return { release: c.t + ex, arrive: c.t + ex + Math.max(0.15, (toB1(c.at) - 0.9) / speed), to: '1B' };
  };
  for (const c of cands) Object.assign(c, finish(c));
  const pick = cands.find((c) => c.how === 'set' && c.arrive <= runner - 0.3) ?? cands.reduce((a, b) => (b.arrive < a.arrive ? b : a));
  const margin = Math.round((runner - pick.arrive) * 1000) / 1000;   // 양수면 송구가 먼저(아웃). ms로 반올림해 기기마다 같게
  return { pos, how: pick.how, charge: !!pick.charge, field: { t: pick.t, at: pick.at }, release: { t: pick.release }, arrive: margin < -0.6 ? null : { t: pick.arrive, to: pick.to }, runner, margin, safe: margin <= 0 };
}

// ===== 소리: 파일 없이 Web Audio로 합성 =====
const Sound = (() => {
  let ac = null, master = null, noiseBuf = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.7; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    loadCrowd();
  }
  function env(g, t0, attack, dur, peak) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function noise({ dur = 0.1, type = 'bandpass', freq = 2000, freqTo, q = 1, peak = 0.5, attack = 0.002, delay = 0 }) {
    if (!ac) return;
    const t0 = ac.currentTime + delay;
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t0);
    if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
    const g = ac.createGain(); env(g, t0, attack, dur, peak);
    src.connect(f).connect(g).connect(master);
    src.start(t0, Math.random()); src.stop(t0 + dur + 0.05);
  }
  function tone({ freq = 440, freqTo, dur = 0.1, type = 'sine', peak = 0.3, attack = 0.002, delay = 0 }) {
    if (!ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (freqTo) o.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur);
    const g = ac.createGain(); env(g, t0, attack, dur, peak);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  // 관중 함성(2026-10-30 '홈런 함성' 요청). 합성으로 세 번 만들어 들려 드렸지만 사람 소리처럼 들리지 않아서, 사용자 결정으로
  // 실제 경기장 함성 녹음(crowd.mp3, CC0)을 튼다. 소리를 처음 켤 때 한 번 받아 두고, 못 받으면(오프라인, file://) 아래 합성 함성으로 대신한다.
  // 녹음은 사용자가 후보 넷(메이저리그 홈런, 한국 야구장, 축구장 반응, 박수 섞인 환호) 가운데 고른 축구장 관중 반응이다:
  // freesound.org/s/829453 (itmightgetloud, FC St. Pauli 밀러른토어 경기장, CC0 1.0)의 7~13초를 잘라 앞뒤를 흐리게 하고 크기를 맞춰 mono 96kbps로 줄였다.
  // 크기는 사용자가 "너무 커서 놀랄 것 같다"고 해서 가장 큰 50ms 크기 0.06쯤(나무 '딱'의 절반)으로 맞췄다. level 1 안타(앞 1.8초), 2 홈런, 3 끝내기
  const CROWD_URL = 'crowd.mp3', CROWD_GAIN = 0.37;
  let crowdBuf = null;
  function loadCrowd() {
    fetch(CROWD_URL).then((r) => (r.ok ? r.arrayBuffer() : Promise.reject(new Error(String(r.status)))))
      .then((b) => new Promise((ok, no) => ac.decodeAudioData(b, ok, no)))   // 옛 사파리는 콜백 방식만 된다
      .then((buf) => { crowdBuf = buf; })
      .catch(() => { /* 합성 함성으로 대신한다 */ });
  }
  function roarRecording(level) {
    const t0 = ac.currentTime, src = ac.createBufferSource(), g = ac.createGain();
    src.buffer = crowdBuf; src.playbackRate.value = 0.96 + Math.random() * 0.08;   // 칠 때마다 조금씩 다르게
    const len = crowdBuf.duration / src.playbackRate.value, dur = level === 1 ? Math.min(1.8, len) : len, peak = CROWD_GAIN * [0, 0.5, 1, 1.2][level];
    g.gain.setValueAtTime(peak, t0); g.gain.setValueAtTime(peak, t0 + dur - 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(g).connect(master); src.start(t0); src.stop(t0 + dur + 0.05);
  }
  // 합성 함성(녹음을 못 받았을 때). 높이가 다른 목소리 수십 개(톱니파)와 숨소리·웅성임(잡음)을 모음 울림(포먼트) 셋으로 거르는데,
  // 울림이 '우'에서 '아'로 열려 '와'가 되고 끝에 조금 닫힌다. 경기장 울림(잔향)을 입히고 휘파람과 박수를 흩뿌린다
  const ROAR = { voice: 0.035, breath: 0.5, gain: 1.7 };
  function swell(param, t0, peak, attack, dur) {
    param.setValueAtTime(0.0001, t0);
    param.exponentialRampToValueAtTime(peak, t0 + attack);
    param.linearRampToValueAtTime(peak * 0.7, t0 + dur * 0.6);
    param.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  let hall = null;
  function stadium() {   // 경기장 울림: 1.8초 동안 사그라드는 잡음을 잔향으로 쓴다(처음 부를 때 한 번 만든다)
    if (hall) return hall;
    const len = Math.floor(ac.sampleRate * 1.8), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    hall = ac.createConvolver(); hall.buffer = ir;
    const wet = ac.createGain(); wet.gain.value = 0.3;
    hall.connect(wet).connect(master);
    return hall;
  }
  function roar(level = 2) {
    if (!ac) return;
    if (crowdBuf) { roarRecording(level); return; }
    const t0 = ac.currentTime, dur = [0, 2, 4, 4.8][level], k = [0, 0.45, 1, 1.15][level], end = t0 + dur;
    const bus = ac.createGain(), out = ac.createGain();
    swell(out.gain, t0, k * ROAR.gain, 0.35, dur);
    out.connect(master); out.connect(stadium());
    for (const [f, q, g, from] of [[800, 4, 1, 350], [1200, 5, 0.6, 750], [2600, 6, 0.25, 2200]]) {   // 모음 울림: '우'→'아'로 열린다
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
      bp.frequency.setValueAtTime(from, t0); bp.frequency.exponentialRampToValueAtTime(f, t0 + 0.3);
      bp.frequency.setValueAtTime(f, t0 + dur * 0.7); bp.frequency.exponentialRampToValueAtTime(f * 0.8, end);
      const gn = ac.createGain(); gn.gain.value = g;
      bus.connect(bp).connect(gn).connect(out);
    }
    const shakes = [4.6, 5.4, 6.3].map((hz) => {   // 목소리 떨림(30센트). 목소리마다 만들지 않고 셋을 나눠 쓴다
      const lfo = ac.createOscillator(), depth = ac.createGain();
      lfo.frequency.value = hz; depth.gain.value = 30; lfo.connect(depth); lfo.start(t0); lfo.stop(end + 0.1);
      return depth;
    });
    for (let i = 0, n = [0, 14, 30, 36][level]; i < n; i++) {
      const o = ac.createOscillator(), g = ac.createGain(), base = 110 + Math.random() * 240, s = t0 + Math.random() * 0.25, e = end - Math.random() * dur * 0.2;
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(base * 0.85, s);
      o.frequency.exponentialRampToValueAtTime(base * (1.15 + Math.random() * 0.2), s + 0.3);   // '와' 하고 올라간다
      o.frequency.exponentialRampToValueAtTime(base * (1.02 + Math.random() * 0.1), e - 0.4);
      o.frequency.exponentialRampToValueAtTime(base * 0.8, e);   // 끝에 '아~' 하고 내려온다
      shakes[i % 3].connect(o.detune);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(ROAR.voice, s + 0.15);
      for (let t = s + 0.5; t < e - 0.5; t += 0.4 + Math.random() * 0.3) g.gain.linearRampToValueAtTime(ROAR.voice * (0.5 + Math.random() * 0.5), t);   // 저마다 커졌다 작아진다
      g.gain.exponentialRampToValueAtTime(0.0001, e);
      o.connect(g).connect(bus); o.start(s); o.stop(e + 0.05);
    }
    const src = ac.createBufferSource(), ng = ac.createGain();   // 숨소리·웅성임
    src.buffer = noiseBuf; src.loop = true; ng.gain.value = ROAR.breath;
    src.connect(ng).connect(bus); src.start(t0, Math.random()); src.stop(end + 0.05);
    for (let i = 0; i < [0, 0, 3, 5][level]; i++) {   // 휘파람: 올라가는 '휘익', 반쯤은 내려오는 소리가 이어진다
      const d = 0.4 + Math.random() * 1.4, f0 = 1700 + Math.random() * 700;
      tone({ freq: f0, freqTo: f0 * 1.35, dur: 0.22, peak: 0.07, attack: 0.03, delay: d });
      if (Math.random() < 0.5) tone({ freq: f0 * 1.3, freqTo: f0 * 0.85, dur: 0.35, peak: 0.06, attack: 0.03, delay: d + 0.26 });
    }
    for (let i = 0; i < [0, 20, 50, 80][level]; i++) {   // 박수(한 번에 소리 마디를 수백 개 만들면 느린 폰에서 끊길 수 있어 이 정도로 둔다)
      noise({ dur: 0.025, freq: 1100 + Math.random() * 1600, q: 1.2, peak: (0.06 + Math.random() * 0.1) * k, delay: 0.25 + Math.random() * dur * 0.75 });
    }
  }
  return {
    init,
    crack(power, style = 'sound-wood') {   // 딱. power 0~1. style은 상점의 타격음
      if (style === 'sound-metal') {   // 알루미늄 '깡': 높은 음이 길게 울린다
        noise({ dur: 0.04, freq: 4200, q: 1.4, peak: 0.45 + 0.3 * power });
        tone({ freq: 2350, freqTo: 2050, dur: 0.45 + 0.25 * power, type: 'triangle', peak: 0.22 + 0.15 * power });
        tone({ freq: 3480, freqTo: 3300, dur: 0.3, peak: 0.1 });
        return;
      }
      if (style === 'sound-toy') {   // 장난감 '뿅'
        tone({ freq: 420, freqTo: 1500, dur: 0.16, type: 'square', peak: 0.16 });
        tone({ freq: 840, freqTo: 3000, dur: 0.12, peak: 0.08, delay: 0.02 });
        return;
      }
      if (style === 'sound-bomb') {   // 폭탄 '쾅': 터지는 소리 + 낮게 울리는 폭음 + 흩어지는 파편. 폰 스피커는 낮은 소리를 거의 못 내서 가운데 대역 울림을 더한다
        noise({ dur: 0.05, freq: 3200, q: 0.7, peak: 0.35 + 0.15 * power });
        noise({ dur: 1.1, type: 'lowpass', freq: 1600, freqTo: 110, peak: 0.6 + 0.2 * power, attack: 0.004 });
        noise({ dur: 0.6, freq: 550, q: 0.8, peak: 0.35, attack: 0.004 });
        tone({ freq: 95, freqTo: 30, dur: 0.75, peak: 0.45 + 0.15 * power });
        for (let i = 0; i < 7; i++) noise({ dur: 0.03, freq: 1500 + Math.random() * 2500, q: 2, peak: 0.05 + Math.random() * 0.07, delay: 0.1 + Math.random() * 0.45 });
        return;
      }
      if (style === 'sound-laser') {   // 레이저 '퓽': 높은 음이 빠르게 떨어진다
        tone({ freq: 1900, freqTo: 170, dur: 0.28, type: 'sawtooth', peak: 0.32 });
        tone({ freq: 2500, freqTo: 230, dur: 0.22, type: 'square', peak: 0.12, delay: 0.015 });
        return;
      }
      if (style === 'sound-bell') {   // 종 '댕': 서로 어긋난 배음이 길게 울린다
        noise({ dur: 0.03, freq: 5200, q: 1, peak: 0.15 });
        tone({ freq: 523, dur: 1.5, peak: 0.26 });
        tone({ freq: 1306, dur: 1.0, peak: 0.13 });
        tone({ freq: 2210, dur: 0.6, peak: 0.08 });
        tone({ freq: 3140, dur: 0.3, peak: 0.05 });
        return;
      }
      if (style === 'sound-drum') {   // 북 '둥'. 낮은 울림은 폰에서 잘 안 들려서 가죽 울림(330Hz)과 채 소리를 함께 낸다
        tone({ freq: 165, freqTo: 55, dur: 0.45, peak: 0.55 + 0.2 * power });
        tone({ freq: 330, freqTo: 150, dur: 0.25, type: 'triangle', peak: 0.3 });
        noise({ dur: 0.08, type: 'lowpass', freq: 900, peak: 0.3 });
        noise({ dur: 0.02, freq: 1800, q: 1.2, peak: 0.2 });
        return;
      }
      noise({ dur: 0.07 + 0.05 * power, freq: 2600, q: 0.9, peak: 0.5 + 0.5 * power });
      tone({ freq: 1500, freqTo: 700, dur: 0.05, type: 'triangle', peak: 0.25 + 0.2 * power });
      tone({ freq: 180, freqTo: 70, dur: 0.14, peak: 0.25 + 0.45 * power });
    },
    foul() { noise({ dur: 0.05, freq: 1400, q: 1.5, peak: 0.35 }); tone({ freq: 600, freqTo: 400, dur: 0.04, type: 'triangle', peak: 0.12 }); },
    whoosh() { noise({ dur: 0.22, freq: 300, freqTo: 1600, q: 1.2, peak: 0.22, attack: 0.05 }); },
    mitt() { noise({ dur: 0.08, type: 'lowpass', freq: 700, peak: 0.6 }); tone({ freq: 120, freqTo: 80, dur: 0.09, peak: 0.35 }); },
    release() { noise({ dur: 0.15, type: 'highpass', freq: 2500, peak: 0.05, attack: 0.03 }); },
    roar,
    crowdReady: () => crowdBuf != null,

    ding() { tone({ freq: 880, dur: 0.12, peak: 0.15 }); tone({ freq: 1320, dur: 0.18, peak: 0.12, delay: 0.08 }); },
    tick() { tone({ freq: 1400, dur: 0.035, type: 'square', peak: 0.06 }); },
    groan() { noise({ dur: 0.6, type: 'lowpass', freq: 500, peak: 0.12, attack: 0.15 }); },
  };
})();

// ===== 화면과 원근 =====
// 카메라는 홈플레이트 뒤 3.2m, 눈높이 1.4m에서 투수 쪽을 본다. 멀수록 f / 거리만큼 작게 그린다
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, dpr: 1, f: 0, cx: 0, cy: 0, panX: 0, panY: 0, mobile: false, shake: 0 };
const cam = { x: 0, y: 1.4, z: -3.2 };
const FONT = "-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif";
const font = (size, weight = 700) => `${weight} ${Math.round(size)}px ${FONT}`;
function resize() {
  view.dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = window.innerWidth; view.h = window.innerHeight;
  canvas.width = Math.round(view.w * view.dpr); canvas.height = Math.round(view.h * view.dpr);
  view.mobile = view.w < 640;
  view.f = Math.min(1.45 * view.h, (view.mobile ? MOBILE_FOV_W : 2.3) * view.w);
  view.cx = view.w / 2;
  view.cy = view.h * (view.mobile ? 0.31 : 0.34);
}

function project(x, y, z) {
  const d = z - cam.z;
  if (d < 0.1) return null;
  const s = view.f / d;
  return { x: view.cx + sceneShift() + view.panX + (x - cam.x) * s, y: view.cy + view.panY - (y - cam.y) * s, s };
}

// points: [x, z, y = 0] 목록. close면 닫힌 도형
function path3d(points, close = true) {
  ctx.beginPath();
  let first = true;
  for (const [x, z, y = 0] of points) {
    const p = project(x, y, z);
    if (!p) continue;
    if (first) { ctx.moveTo(p.x, p.y); first = false; } else ctx.lineTo(p.x, p.y);
  }
  if (close) ctx.closePath();
}

function fill3d(points, color) { path3d(points); ctx.fillStyle = color; ctx.fill(); }

function arcPoints(from, to, step, fn) {
  const out = [];
  const dir = from <= to ? 1 : -1;
  for (let a = from; dir > 0 ? a <= to : a >= to; a += step * dir) out.push(fn(a));
  return out;
}

function drawField() {
  const { w, h } = view;
  const horizon = view.cy + view.panY;
  const sky = ctx.createLinearGradient(0, 0, 0, Math.max(1, horizon));
  sky.addColorStop(0, '#040912'); sky.addColorStop(1, '#16305a');
  ctx.fillStyle = sky; ctx.fillRect(-50, -50, w + 100, h + 100);
  ctx.fillStyle = '#145029'; ctx.fillRect(-50, horizon, w + 100, h - horizon + 100);

  // 관중석
  const stands = [
    ...arcPoints(-58, 58, 4, (a) => [...polar(a, fenceDist(a) + 2), 3]),
    ...arcPoints(58, -58, 4, (a) => [...polar(a, fenceDist(a) + 45), 24]),
  ];
  path3d(stands);
  const st = ctx.createLinearGradient(0, horizon - view.f * 0.2, 0, horizon);
  st.addColorStop(0, '#0a1222'); st.addColorStop(1, '#1f2c44');
  ctx.fillStyle = st; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
  for (let k = 1; k < 6; k++) {
    path3d(arcPoints(-58, 58, 4, (a) => [...polar(a, fenceDist(a) + 2 + 43 * k / 6), 3 + 21 * k / 6]), false);
    ctx.stroke();
  }
  // 투수 뒤 가운데는 관중 없이 어둡게(배터스 아이)
  fill3d([...arcPoints(-CROWD_EYE, CROWD_EYE, 1, (a) => [...polar(a, fenceDist(a) + 2), 3]), ...arcPoints(CROWD_EYE, -CROWD_EYE, 1, (a) => [...polar(a, fenceDist(a) + 45), 24])], '#07120d');
  drawCrowd();
  // 조명탑
  for (const a of [-42, -15, 15, 42]) {
    const [x, z] = polar(a, fenceDist(a) + 55);
    const p = project(x, 36, z);
    if (!p) continue;
    const R = view.f * 0.09;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
    g.addColorStop(0, 'rgba(255,250,220,0.85)'); g.addColorStop(0.18, 'rgba(255,245,200,0.28)'); g.addColorStop(1, 'rgba(255,245,200,0)');
    ctx.fillStyle = g; ctx.fillRect(p.x - R, p.y - R, R * 2, R * 2);
    ctx.fillStyle = '#fffbe8'; ctx.fillRect(p.x - p.s * 3, p.y - p.s, p.s * 6, p.s * 2);
  }

  // 담장과 경고 트랙
  const fenceBase = arcPoints(-45, 45, 3, (a) => [...polar(a, fenceDist(a)), 0]);
  const fenceTop = arcPoints(-45, 45, 3, (a) => [...polar(a, fenceDist(a)), 3]);
  fill3d([...fenceBase, ...fenceTop.slice().reverse()], '#0d3b2b');
  path3d(fenceTop, false); ctx.strokeStyle = '#f2c94c'; ctx.lineWidth = 2; ctx.stroke();

// ===== 관중 =====
// 외야 관중석(담장 뒤 띠)을 사람으로 채운다(2026-10-29 사용자 요청). 1루 쪽(화면 오른쪽)은 내 팀, 3루 쪽은 상대 팀 색 옷이 많다.
// 투수 바로 뒤(가운데 ±CROWD_EYE도)는 실제 구장의 배터스 아이처럼 비운다. 공을 놓는 높이가 관중석과 겹쳐서 관중이 있으면 공이 묻힌다.
// 수천 명을 매 화면 그리면 폰이 버거워서, 앉은 모습과 일어나 손을 든 모습을 한 번씩 따로 그려 두고(화면 크기·팀이 바뀔 때만 다시) 붙인다.
// 안타·홈런·끝내기 때는 세로 띠마다 조금씩 다르게 일어났다 앉고, 홈런·끝내기에는 카메라 플래시가 터진다
const CROWD_ROWS = 22, CROWD_EYE = 4;   // 관중석 줄 수, 가운데 비우는 각도(±도). 공을 놓는 곳이 ±1.6도라 ±4도면 공이 관중에 묻히지 않는다(±6도는 폰에서 화면 폭의 40%가 검었다)
const crowd = { key: '', sit: null, stand: null, res: 1, x0: 0, y0: 0, people: [], builds: 0, at: 0, dur: 0, power: 0 };

function crowdPalette(teamId) {
  const t = teamById(teamId), plain = ['#eceef2', '#c9ced8', '#1c2130', '#2c3650', '#6f7b90'];   // 흰 옷, 회색, 검정·남색
  return t ? [t.main, t.main, t.main, t.main, t.accent, ...plain] : ['#c8504a', '#3a6db0', '#d9b44a', '#3d8b58', ...plain];
}

function buildCrowd(key) {
  const pan = [view.panX, view.panY];
  view.panX = view.panY = 0;   // 공을 따라가는 화면 이동은 붙일 때 더한다
  const rnd = mulberry32(20261029), home = crowdPalette(settings.team), away = crowdPalette(game.opponent), people = [];
  for (let k = CROWD_ROWS - 1; k >= 0; k--) {   // 뒷줄(화면 위)부터 그려서 앞줄 머리가 뒷줄 몸을 가린다
    const t = (k + 0.5) / CROWD_ROWS, y = 3 + 21 * t;
    for (let a = -57; a <= 57;) {
      const d = fenceDist(a) + 2 + 43 * t, step = 0.9 / d / DEG;   // 자리 간격 0.9m
      if (Math.abs(a) >= CROWD_EYE && rnd() > 0.12) {   // 12%는 빈자리
        const [x, z] = polar(a + (rnd() - 0.5) * step * 0.4, d), p = project(x, y, z), pal = a > 0 ? home : away;
        if (p) people.push({ a, x: p.x, y: p.y, s: p.s, shirt: pal[Math.floor(rnd() * pal.length)], head: rnd() < 0.25 ? pal[0] : rnd() < 0.5 ? '#d6a57f' : '#b98a66' });
      }
      a += step;
    }
  }
  [view.panX, view.panY] = pan;
  Object.assign(crowd, { key, people, sit: null, stand: null, builds: crowd.builds + 1 });
  if (!people.length) return;
  const minX = Math.min(...people.map((q) => q.x - q.s)), maxX = Math.max(...people.map((q) => q.x + q.s));
  const minY = Math.min(...people.map((q) => q.y - 1.8 * q.s)), maxY = Math.max(...people.map((q) => q.y + 1));
  const res = Math.min(view.dpr, 1.5, 4096 / (maxX - minX));   // 사람이 1~2px이라 1.5배면 충분하다(폰 메모리를 아낀다)
  const paint = (standing) => {
    const c = document.createElement('canvas');
    c.width = Math.ceil((maxX - minX) * res); c.height = Math.ceil((maxY - minY) * res);
    const g = c.getContext('2d');
    g.setTransform(res, 0, 0, res, -minX * res, -minY * res);
    for (const q of people) {
      const bw = 0.46 * q.s, bh = 0.6 * q.s, hr = Math.max(0.5, 0.13 * q.s), top = q.y - bh - (standing ? 0.3 * q.s : 0);
      g.fillStyle = q.shirt; g.fillRect(q.x - bw / 2, top, bw, q.y - top);
      if (standing) {   // 손을 든 팔
        const aw = Math.max(0.5, 0.1 * q.s), al = 0.45 * q.s;
        g.fillRect(q.x - bw / 2 - aw * 0.3, top - al, aw, al); g.fillRect(q.x + bw / 2 - aw * 0.7, top - al, aw, al);
      }
      g.fillStyle = q.head; g.beginPath(); g.arc(q.x, top - hr * 0.9, hr, 0, Math.PI * 2); g.fill();
    }
    g.setTransform(1, 0, 0, 1, 0, 0);   // 밤 관중석이라 멀수록(위로 갈수록) 어둡게
    g.globalCompositeOperation = 'source-atop';
    const dark = g.createLinearGradient(0, 0, 0, c.height);
    dark.addColorStop(0, 'rgba(4,8,18,0.6)'); dark.addColorStop(1, 'rgba(4,8,18,0.22)');
    g.fillStyle = dark; g.fillRect(0, 0, c.width, c.height);
    return c;
  };
  Object.assign(crowd, { res, x0: minX, y0: minY, sit: paint(false), stand: paint(true) });
}

// power 1 안타, 2 홈런, 3 끝내기. delay초 뒤 일어나 dur초 동안 환호한다
function cheerCrowd(power, dur, delay = 0) { Object.assign(crowd, { at: performance.now() / 1000 + delay, dur, power }); }

function drawCrowd() {
  if (!view.w) return;
  const key = [view.w, view.h, view.dpr, sceneShift(), settings.team, game.opponent].join('|');
  if (crowd.key !== key) buildCrowd(key);
  if (!crowd.sit) return;
  const now = performance.now() / 1000, u = (now - crowd.at) / crowd.dur, res = crowd.res;
  const ox = crowd.x0 + view.panX, oy = crowd.y0 + view.panY, H = crowd.sit.height / res;
  if (!(u >= 0 && u < 1)) { ctx.drawImage(crowd.sit, ox, oy, crowd.sit.width / res, H); return; }
  const env = Math.min(1, u * 6, (1 - u) * 3), N = 40, sw = crowd.sit.width / N;   // 빨리 일어나고 천천히 앉는다
  for (let i = 0; i < N; i++) {
    const lift = env * (0.5 + 0.5 * Math.sin(now * (7 + crowd.power) + i * 1.7 + (i % 3)));
    const img = lift > 0.2 ? crowd.stand : crowd.sit;
    ctx.drawImage(img, i * sw, 0, sw, img.height, ox + i * sw / res, oy - lift * (1 + crowd.power) * 1.6, sw / res + 0.5, H);
  }
  if (crowd.power >= 2) {   // 홈런·끝내기에는 카메라 플래시
    ctx.fillStyle = '#fffbe6';
    for (let n = 0; n < 6 * crowd.power; n++) {
      const q = crowd.people[Math.floor(Math.random() * crowd.people.length)];
      ctx.globalAlpha = env * (0.4 + 0.6 * Math.random());
      ctx.fillRect(q.x + view.panX - 1, q.y - 0.8 * q.s + view.panY - 1, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
}

// 키 장면 사이를 속도가 이어지는 곡선(에르미트)으로 잇는다. 방향이 바뀌는 곳과 값이 그대로인 곳(디딘 발)은 그 방향 속도만 0이라 넘치지 않는다.
// 전에는 장면 사이마다 따로 부드럽게 이어서 키 장면마다 멈칫했다(2026-11-02 사용자 요청 '던지는 것을 더 부드럽고 자연스럽게')
function makeTrack(keys) {
  const tans = keys.map(([t, v], j) => v.map((x, c) => {
    if (j === 0 || j === keys.length - 1) return 0;
    const [ta, va] = keys[j - 1], [tb, vb] = keys[j + 1], d0 = (x - va[c]) / (t - ta), d1 = (vb[c] - x) / (tb - t);

    if (t >= keys[keys.length - 1][0]) return keys[keys.length - 1][1];

const pitchVec = (q) => [...q.pel, q.hip, q.sh, q.lean, ...q.lf, ...q.rf, ...q.gl, ...q.bh, q.tilt];
const pitchTrack = makeTrack(PITCH_KEYS.map(([t, q]) => [t, pitchVec(q)]));
// t초의 투수 뼈대(화면 기준 좌표). 좌완은 좌우를 거울로 뒤집는다
// 키 값(pitchVec 모양: 엉덩이 자리·엉덩이·어깨 방향·숙임·발·손·기울기)을 뼈대로 조립한다. 투수와 수비수가 함께 쓴다.
// W(x, y, z)는 키 좌표 → 화면 기준 좌표, R(v)는 키 방향 → 화면 기준 방향, yawOf(도)는 키의 몸 방향 → 화면 기준 라디안이다.
// 키는 오른손잡이 기준(lf 왼발, rf 오른발, gl 글러브 손, bh 공 쥔 손)이고, lefty면 거울로 뒤집은 뒤 좌우 짝을 바꾼다
function assembleFigure(v, W, R, yawOf, lefty = false) {
  const facing = (deg) => [Math.cos(yawOf(deg)), 0, Math.sin(yawOf(deg))], left = (deg) => [-Math.sin(yawOf(deg)), 0, Math.cos(yawOf(deg))];
  const [px, py, pz, hipYaw, shYaw, lean] = v, tilt = v[18], pelvis = W(px, py, pz), f = facing(shYaw), l = left(shYaw), fh = facing(hipYaw), lh = left(hipYaw);
  const gside = V.mul(l, lefty ? -1 : 1);   // 글러브 쪽
  const chest = V.add(pelvis, V.add(V.add([0, 0.5 * Math.cos(lean) * Math.cos(tilt), 0], V.mul(f, 0.5 * Math.sin(lean))), V.mul(gside, 0.5 * Math.sin(tilt))));
  const hips = { l: V.add(pelvis, V.mul(lh, 0.12)), r: V.add(pelvis, V.mul(lh, -0.12)) };
  const sl = V.add(V.mul(l, Math.cos(tilt)), [0, -Math.sin(tilt) * (lefty ? -1 : 1), 0]);   // 기운 어깨선: 글러브 쪽 어깨가 내려간다
  const shoulders = { l: V.add(chest, V.mul(sl, 0.2)), r: V.add(chest, V.mul(sl, -0.2)) };
  const ballHand = lefty ? 'l' : 'r', mittHand = lefty ? 'r' : 'l';
  const lfoot = W(v[6], v[7], v[8]), rfoot = W(v[9], v[10], v[11]), glove = W(v[12], v[13], v[14]), ball = W(v[15], v[16], v[17]);
  const feet = { [mittHand]: lfoot, [ballHand]: rfoot }, hands = { [mittHand]: glove, [ballHand]: ball };
  const knees = { l: bendJoint(hips.l, feet.l, 0.46, 0.45, fh), r: bendJoint(hips.r, feet.r, 0.46, 0.45, fh) };
  const out = (side) => V.mul(l, side === 'l' ? 1 : -1);   // 그쪽 바깥
  const elbows = {   // 공 쥔 팔꿈치는 바깥·조금 아래·뒤쪽, 글러브 팔꿈치는 바깥·아래로 굽는다
    [ballHand]: bendJoint(shoulders[ballHand], ball, 0.3, 0.29, V.add(out(ballHand), R([0, -0.5, 0.3]))),
    [mittHand]: bendJoint(shoulders[mittHand], glove, 0.3, 0.29, V.add(out(mittHand), [0, -0.6, 0])),
  };
  const head = V.add(chest, V.add([0, 0.24 * Math.cos(lean), 0], V.mul(f, 0.24 * Math.sin(lean))));
  return { world: true, noBat: true, plain: true, cap: true, bare: true, side: 1, front: 0, mitt: mittHand, ballHand, e: 0, shTurn: shYaw, hipTurn: hipYaw,
    pelvis, chest, hips, shoulders, feet, knees, elbows, hands, hand: ball, tip: ball, yaw: 0, left, facing, head };
}
// t초의 투수 뼈대(화면 기준 좌표). 키는 마운드 위 좌표이고 좌완은 좌우를 거울로 뒤집는다
function pitcherSkeleton(t, lefty = false) {
  const m = lefty ? -1 : 1;
  const k = assembleFigure(pitchTrack(t), (x, y, z) => [m * x, 0.25 + y, MOUND + z], (q) => [m * q[0], q[1], q[2]], (deg) => (lefty ? 180 - deg : deg) * DEG, lefty);
  k.brim = V.add(k.head, [0, -0.03, -0.12]);   // 투수는 늘 홈(포수) 쪽을 본다
  return k;
}

// ===== 사람 그리기 공통 =====
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
};

// 두 마디(넓적다리·정강이, 위팔·아래팔)를 이을 무릎·팔꿈치 위치. pole 쪽으로 굽힌다
function bendJoint(a, c, l1, l2, pole) {
  const d = V.sub(c, a), full = V.len(d) || 1;
  const dist = Math.min(full, l1 + l2 - 0.001);
  const dir = V.mul(d, 1 / full);
  const along = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
  const h = Math.sqrt(Math.max(0, l1 * l1 - along * along));
  const p = V.sub(pole, V.mul(dir, V.dot(pole, dir)));
  return V.add(V.add(a, V.mul(dir, along)), V.mul(p, h / (V.len(p) || 1)));
}

// 굵기가 wa에서 wb로 변하는 마디(화면 좌표). 같은 색끼리는 관절이 이음매 없이 붙는다
function segment(a, b, wa, wb, color) {
  if (!a || !b) return;
  const dx = b.x - a.x, dy = b.y - a.y, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(a.x + nx * wa / 2, a.y + ny * wa / 2); ctx.lineTo(b.x + nx * wb / 2, b.y + ny * wb / 2);
  ctx.lineTo(b.x - nx * wb / 2, b.y - ny * wb / 2); ctx.lineTo(a.x - nx * wa / 2, a.y - ny * wa / 2);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(a.x, a.y, wa / 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(b.x, b.y, wb / 2, 0, Math.PI * 2); ctx.fill();
}

// 점들을 부드럽게 이은 닫힌 경로. 점이 모자라면 false
function smoothPath(pts) {
  pts = pts.filter(Boolean);
  if (pts.length < 3) return false;
  const n = pts.length, mid = (p, q) => ({ x: (p.x + q.x) / 2, y: (p.y + q.y) / 2 });
  const m0 = mid(pts[n - 1], pts[0]);
  ctx.beginPath(); ctx.moveTo(m0.x, m0.y);
  for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); ctx.quadraticCurveTo(pts[i].x, pts[i].y, m.x, m.y); }
  ctx.closePath();
  return true;
}

// 점들을 부드럽게 이은 닫힌 도형
function smoothShape(pts, fill) { if (smoothPath(pts)) { ctx.fillStyle = fill; ctx.fill(); } }

function ellipseAt(p, rx, ry, color) {
  if (!p) return;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, Math.max(0.5, rx), Math.max(0.5, ry), 0, 0, Math.PI * 2); ctx.fill();
}

// 화면 점들을 감싸는 볼록 다각형. 돌아가는 몸통의 윤곽을 만든다
function hull(pts) {
  const p = pts.filter(Boolean).sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [], upper = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

  const k = pitcherSkeleton(t, lefty), C = pitcherColors();

// ===== 스트라이크 존과 공 =====

// 공 회전(2026-10-30 유저 목소리 '커브가 무회전으로 온다'). 전에는 빨간 호 두 개를 화면 안에서 돌려서(바람개비) 커브의 앞회전으로

function drawBall(pos, { alpha = 1, spin = null, scale = 1.5, shadow = true, glow = false } = {}) {

  ctx.fill();
  if (r > 2.2) {   // 폰에서는 공이 작아서 전에는 3.5px부터라 처음 40%쯤 실밥이 안 보였다
    ctx.clip();
    const lw = Math.max(1, r * 0.13);
    if (spin) {   // 바로 앞 두 장면의 실밥을 옅게 겹쳐 빠르게 도는 느낌을 준다
      const step = (SPIN[spin.type]?.w ?? 0) / 60;
      drawSeam(p, r, seamPoints(spin, -2 * step), lw, 0.18);
      drawSeam(p, r, seamPoints(spin, -step), lw, 0.32);
    }
    drawSeam(p, r, seamPoints(spin), lw, 1);
  }
  ctx.restore();
}

// 다시 보기: 점은 실제 궤적, 점선은 휘지 않았다면 갔을 길
function drawTrail(p, uEnd) {
  const def = PITCHES[p.type];
  const hs = p.lefty ? -1 : 1, a = project(RELEASE.x * hs, RELEASE.y, RELEASE.z), b = project(p.tx - def.brk.x * hs, p.ty - def.brk.y, 0);
  if (a && b && p.type !== 'fastball') {
    ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore();
  }
  ctx.fillStyle = def.color;
  for (let u = 0.03; u <= uEnd + 1e-6; u += 0.035) {
    const q = ballPos(p, u), s = project(q.x, q.y, q.z);
    if (!s) continue;
    ctx.globalAlpha = 0.3 + 0.6 * u;
    ctx.beginPath(); ctx.arc(s.x, s.y, Math.max(1.4, BALL_R * 0.7 * s.s), 0, Math.PI * 2); ctx.fill();
  }

}

// ===== 타자와 배트 =====
const BATTER_X = -1.0, BATTER_Z = 0.3, BAT_LEN = 0.86, SWING_TIME = 0.28;
// 모바일(세로 화면)은 가로가 좁아 타자(홈플레이트에서 1m 옆)가 화면 밖으로 나갔다(2026-10-29, 390폭에서 거의 안 보임).
// 타자 그림만 홈플레이트 쪽으로 0.4m 당기고, 장면 전체를 타자 반대쪽으로 화면 폭의 5% 밀고, 조금 넓게 본다.
// 판정은 타이밍만 봐서 그림에만 영향이 있다. PC와 가로 화면은 그대로
const MOBILE_BATTER_SHIFT = 0.4, MOBILE_SCENE_SHIFT = 0.05, MOBILE_FOV_W = 2.15;
const batterShift = () => (view.mobile ? MOBILE_BATTER_SHIFT : 0);
const sceneShift = () => (view.mobile ? batSide() * view.w * MOBILE_SCENE_SHIFT : 0);
const batterPoint = (p) => project(batSide() * (p[0] + batterShift()), p[1], p[2]);   // 타자 뼈대의 한 점을 화면으로
function batterSpan() {   // 테스트용: 칠 준비 자세의 몸(머리·손·무릎·발)이 화면에서 차지하는 가로 범위
  const k = batterSkeleton(null), xs = [k.head, k.hand, k.knees.l, k.knees.r, k.feet.l, k.feet.r, k.chest].map((p) => batterPoint(p).x);
  return { min: Math.min(...xs), max: Math.max(...xs), w: view.w };
}

// tau: 스윙 뒤 지난 시간(초), null이면 준비 자세. 누른 순간을 맞는 순간으로 보여 준다
// yaw는 배트 끝 방향(도): -90 포수 쪽, 0 1루 쪽(플레이트 위), 90 투수 쪽
// pre는 준비 자세의 움직임(2026-11-02 사용자 요청 '타격을 더 부드럽고 자연스럽게', 전에는 공을 기다리는 동안 굳어 있었다):
// idle(초)로 기다리는 동안 방망이를 1초에 0.7번 살짝 까딱이고, load(0~1)만큼 손을 포수 쪽으로 조금 높게 당긴다
function batPose(tau, pre = null) {
  let yaw, pitch, hand;
  if (tau == null) {
    const L = pre?.load ?? 0, w = pre ? (1 - L) * Math.sin(pre.idle * 4.4) : 0, w2 = pre ? (1 - L) * Math.sin(pre.idle * 4.4 + 1.2) : 0;
    yaw = -100 - 12 * L + 6 * w; pitch = 55 + 7 * L + 4 * w2;
    hand = [-0.84, 1.48 + 0.04 * L + 0.01 * w2, 0.04 - 0.1 * L];
  } else {
    const e = easeOut(tau / SWING_TIME), f = smooth((tau - SWING_TIME) / 0.4);   // 휘두른 뒤 0.4초 동안 힘을 빼며 마무리한다
    yaw = lerp(5, 195, e) + 10 * f; pitch = lerp(-8, 45, e) - 6 * f;
    hand = [lerp(-0.5, -1.0, e), lerp(1.02, 1.62, e) - 0.07 * f, lerp(0.3, 0.44, e)];   // 끝에는 손이 앞어깨(왼쪽) 위로 가고 방망이는 어깨 너머로 넘어간다
  }
  const c = Math.cos(pitch * DEG);
  const tip = [hand[0] + BAT_LEN * c * Math.cos(yaw * DEG), hand[1] + BAT_LEN * Math.sin(pitch * DEG), hand[2] + BAT_LEN * c * Math.sin(yaw * DEG)];
  return { hand, tip, yaw };
}

// '#rrggbb'의 밝기를 k배로(1보다 작으면 어둡게)
function tint(hex, k) {

// 타자 뼈대(3D). 준비 자세에서는 어깨가 투수 쪽으로 닫혀 있고, 스윙하면 엉덩이가 먼저, 어깨가 뒤따라 돈다
// pre.load만큼 어깨·엉덩이를 포수 쪽으로 감고 앞발을 들었다 투수 쪽으로 12cm 내디딘다. 휘두를 때는 이미 내디딘 발이다
function batterSkeleton(tau, pre = null) {
  const swinging = tau != null, e = swinging ? easeOut(tau / SWING_TIME) : 0, st = swinging ? 1 : smooth(pre?.load ?? 0);
  const shTurn = swinging ? lerp(55, 105, e) : -10 * st, hipTurn = swinging ? lerp(65, 88, e) : -6 * st;
  const at = (x, y, z) => [BATTER_X + x, y, BATTER_Z + z];
  const left = (deg) => [-Math.sin(deg * DEG), 0, Math.cos(deg * DEG)];    // 타자의 왼쪽(처음엔 투수 쪽)
  const facing = (deg) => [Math.cos(deg * DEG), 0, Math.sin(deg * DEG)];   // 가슴이 보는 쪽(처음엔 홈플레이트)
  const sink = swinging ? 0 : 0.03 * st, pelvis = at(-0.02 + 0.05 * e, 0.86 - sink, 0), chest = at(0.06 + 0.05 * e, 1.38 - sink, 0);
  const hips = { l: V.add(pelvis, V.mul(left(hipTurn), 0.12)), r: V.add(pelvis, V.mul(left(hipTurn), -0.12)) };
  const shoulders = { l: V.add(chest, V.mul(left(shTurn), 0.2)), r: V.add(chest, V.mul(left(shTurn), -0.2)) };
  const feet = { l: at(0.03, 0.06 + (swinging ? 0 : 0.09 * Math.sin(Math.PI * st)), 0.4 + 0.12 * st), r: at(-0.06 + 0.08 * e, 0.06 + 0.1 * e, -0.36) };   // 스윙하면 뒷발 뒤꿈치가 들린다
  const knees = { l: bendJoint(hips.l, feet.l, 0.46, 0.45, [1, 0, 0]), r: bendJoint(hips.r, feet.r, 0.46, 0.45, [1, 0, 0]) };
  const { hand, tip, yaw } = batPose(tau, pre);
  // 팔꿈치가 굽는 쪽. 준비·맞는 순간에는 뒷팔 팔꿈치가 아래·뒤(포수 쪽)이고, 팔로스루에서는 두 팔이 몸 앞으로 감겨 등 뒤에서는 가려진다.
  // 전에는 끝까지 뒤로 꺾여서 아래팔이 등을 가로질러 보였다(2026-10-29 사용자 제보)
  const pole = (a, b) => V.add(V.mul(a, 1 - e), V.mul(b, e));
  const elbows = { r: bendJoint(shoulders.r, hand, 0.3, 0.29, pole([-0.3, -0.7, -0.6], [0.3, -0.5, 1])), l: bendJoint(shoulders.l, hand, 0.3, 0.29, pole([0.3, -1, 0.3], [-0.9, 0.4, 0.5])) };
  return { e, shTurn, hipTurn, pelvis, chest, hips, shoulders, feet, knees, elbows, hand, tip, yaw, left, facing, head: V.add(chest, [0.04, 0.24, 0.02]) };
}

// ===== 상점 물건의 모양과 효과 =====

function gradientAlong(a, b, stops) {

}
function drawSparkle(p, r, color) {   // 네 갈래 반짝임

}

// 불꽃: 배트 둘레로 혀 모양 불길이 양옆으로 번갈아 흔들리며 솟고(불은 늘 위로 탄다), 불티가 날린다.
// 처음에는 곧장 위로만 솟게 했더니 배트를 세운 준비 자세에서 불길이 배트를 따라 겹쳐 톱니처럼 보였다
function drawFlames(a, b, wa, wb, t) {
  const n = 9, at = (u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), w: lerp(wa, wb, u) });
  segment(at(0.25), b, wa * 2.6, wb * 2.8, 'rgba(255,110,30,0.16)');   // 달아오른 빛
  for (const [color, hk, wk] of [['rgba(255,70,20,0.85)', 1, 1], ['rgba(255,160,40,0.92)', 0.68, 0.66], ['rgba(255,240,170,0.95)', 0.38, 0.38]]) {
    ctx.fillStyle = color;
    for (let i = 0; i < n; i++) {
      const p = at(0.25 + 0.75 * (i + 0.5) / n), fl = 0.75 + 0.2 * Math.sin(t * 17 + i * 2.1) + 0.1 * Math.sin(t * 31 + i * 5.3);
      const lean = (i % 2 ? 0.6 : -0.6) + 0.15 * Math.sin(t * 7 + i), vl = Math.hypot(lean, 1), v = { x: lean / vl, y: -1 / vl }, q = { x: -v.y, y: v.x };   // 솟는 쪽과 그 옆
      const h = p.w * (2 + 0.5 * (i % 3)) * fl * hk, bw = p.w * 0.6 * wk, sway = Math.sin(t * 9 + i * 1.7) * p.w * 0.35;
      const tip = { x: p.x + v.x * h + q.x * sway, y: p.y + v.y * h + q.y * sway };
      ctx.beginPath(); ctx.moveTo(p.x - q.x * bw, p.y - q.y * bw);
      ctx.quadraticCurveTo(p.x - q.x * bw * 0.9 + v.x * h * 0.55, p.y - q.y * bw * 0.9 + v.y * h * 0.55, tip.x, tip.y);
      ctx.quadraticCurveTo(p.x + q.x * bw * 0.9 + v.x * h * 0.55, p.y + q.y * bw * 0.9 + v.y * h * 0.55, p.x + q.x * bw, p.y + q.y * bw);
      ctx.closePath(); ctx.fill();
    }

  for (let i = 0; i < 4; i++) {   // 불티: 위로 날아가며 사라진다
    const u = (t * 0.9 + i * 0.27) % 1, p = at(0.4 + 0.15 * i);
    ellipseAt({ x: p.x + Math.sin(t * 5 + i) * p.w * 0.6, y: p.y - p.w * (1.2 + 3 * u) }, p.w * 0.1 * (1 - u) + 0.6, p.w * 0.1 * (1 - u) + 0.6, `rgba(255,200,90,${(0.9 * (1 - u)).toFixed(2)})`);
  }
}
// 번개: 몸통 둘레로 지지직 튀는 전기. 0.07초마다 모양이 바뀐다
function drawSparks(a, b, w, t) {
  const len = Math.hypot(b.x - a.x, b.y - a.y) || 1, n = { x: -(b.y - a.y) / len, y: (b.x - a.x) / len }, rnd = mulberry32(Math.floor(t * 14) + 101);

  for (let k = 0; k < 3; k++) {
    const u0 = 0.3 + rnd() * 0.55, span = 0.12 + rnd() * 0.15, pts = [];
    for (let i = 0; i <= 4; i++) pts.push(at(Math.min(1, u0 + span * i / 4), (rnd() - 0.5) * w * 2.2));

}

// 배트: a는 손, b는 끝(화면), wa·wb는 손잡이·끝 굵기(px), s는 끝 자리에서 1m가 몇 px인지
function drawBat(a, b, wa, wb, s, col, fx, detail) {
  const len = Math.hypot(b.x - a.x, b.y - a.y), d = len > 0.5 ? { x: (b.x - a.x) / len, y: (b.y - a.y) / len } : { x: 0, y: -1 }, n = { x: -d.y, y: d.x };
  const along = (stops) => (detail && len > 0.5 ? gradientAlong(a, b, stops) : col('bat'));
  if (fx === 'hammer') {   // 뿅망치: 노란 손잡이 끝에 배트와 직각인 빨간 머리통, 양 끝은 노란 마개, 몸통은 주름
    const c = { x: b.x - d.x * 0.03 * s, y: b.y - d.y * 0.03 * s }, hl = 0.15 * s, hr = 0.075 * s;
    segment(a, c, wa, wa * 1.15, col('bat'));
    const end = (e) => ({ x: c.x + n.x * hl * e, y: c.y + n.y * hl * e });
    segment(end(-1), end(1), hr * 2, hr * 2, col('batEnd'));
    if (!detail) return;
    ctx.strokeStyle = 'rgba(120,10,20,0.55)'; ctx.lineWidth = Math.max(1, hr * 0.16);
    for (const e of [-0.45, -0.15, 0.15, 0.45]) { const p = end(e); ctx.beginPath(); ctx.moveTo(p.x - d.x * hr * 0.9, p.y - d.y * hr * 0.9); ctx.lineTo(p.x + d.x * hr * 0.9, p.y + d.y * hr * 0.9); ctx.stroke(); }
    ctx.fillStyle = '#f7d84a';
    for (const e of [-1, 1]) { const p = end(e * 0.97); ctx.beginPath(); ctx.ellipse(p.x, p.y, hr, hr * 0.42, Math.atan2(d.y, d.x), 0, Math.PI * 2); ctx.fill(); }
    return;
  }
  if (fx === 'leek') {   // 대파: 손잡이 쪽은 흰 줄기, 끝으로 갈수록 초록, 끝에서 잎이 갈라지고 손잡이 밑으로 뿌리가 나온다
    for (const [ang, l] of [[-0.3, 0.2], [0.06, 0.25], [0.34, 0.18]]) {
      const cs = Math.cos(ang), sn = Math.sin(ang), e = { x: b.x + (d.x * cs - d.y * sn) * l * s, y: b.y + (d.x * sn + d.y * cs) * l * s };
      segment(b, e, wb * 0.85, wb * 0.2, detail ? (ang > 0 ? '#2f8a2c' : '#46a83c') : col('bat'));
    }
    segment(a, b, wa * 1.1, wb, along([[0, '#f4f1e2'], [0.42, '#eceecb'], [0.62, '#a9d46c'], [1, col('batEnd')]]));
    if (!detail) return;
    ctx.strokeStyle = '#e3d7b0'; ctx.lineWidth = Math.max(1, wa * 0.09);
    for (let i = 0; i < 6; i++) {
      const ang = Math.PI + (i - 2.5) * 0.22, cs = Math.cos(ang), sn = Math.sin(ang), r0 = wa * 0.5, r1 = wa * 0.5 + 0.05 * s * (0.7 + 0.3 * (i % 2));
      ctx.beginPath(); ctx.moveTo(a.x + (d.x * cs - d.y * sn) * r0, a.y + (d.x * sn + d.y * cs) * r0); ctx.lineTo(a.x + (d.x * cs - d.y * sn) * r1, a.y + (d.x * sn + d.y * cs) * r1); ctx.stroke();
    }
    return;
  }
  if (detail && fx === 'lightning') segment(a, b, wa * 2.4, wb * 2.4, 'rgba(110,190,255,0.22)');   // 푸른 빛
  if (detail && fx === 'ice') segment(a, b, wa * 1.8, wb * 1.8, 'rgba(190,235,255,0.25)');   // 찬 기운
  const body = fx === 'fire' ? along([[0, '#2a1610'], [0.5, col('bat')], [1, col('batEnd')]]) : fx ? along([[0, col('bat')], [1, col('batEnd')]]) : col('bat');
  segment(a, b, wa, wb, body);
  ellipseAt(b, wb / 2, wb / 2, fx && detail ? col('batEnd') : fx ? col('bat') : col('batEnd'));
  if (!detail) return;
  const t = fxTime();
  if (fx === 'fire') drawFlames(a, b, wa, wb, t);
  else if (fx === 'lightning') drawSparks(a, b, wb, t);
  else if (fx === 'ice') {   // 한쪽에 흰 결, 반짝임 셋
    const off = (u, k) => ({ x: lerp(a.x, b.x, u) + n.x * lerp(wa, wb, u) * k, y: lerp(a.y, b.y, u) + n.y * lerp(wa, wb, u) * k });
    segment(off(0.25, 0.22), off(0.95, 0.22), wa * 0.16, wb * 0.16, 'rgba(255,255,255,0.8)');
    [0.45, 0.7, 0.92].forEach((u, i) => drawSparkle(off(u, -0.15), lerp(wa, wb, u) * (0.35 + 0.45 * Math.abs(Math.sin(t * 3 + i * 2.1))), '#ffffff'));
  }
}

// 헬멧: h는 머리 가운데(화면), s는 머리 자리에서 1m가 몇 px인지, brim은 챙(없으면 안 그림). 타자는 투수 쪽을 봐서 뒤통수가 보인다.
// 동물 헬멧은 귀·갈기·가시를 헬멧보다 먼저(뒤에) 그리고, 무늬는 헬멧 위에 그린다. side는 좌타면 -1(빛 받는 쪽만 뒤집힌다)
function drawHelmet(h, s, brim, col, fx, detail, side = 1) {
  const c = col('helmet'), rx = 0.13 * s, ry = 0.125 * s, deco = (color) => (detail ? color : c);
  if (fx === 'rabbit') for (const e of [-1, 1]) {   // 긴 귀
    ctx.save(); ctx.translate(h.x + e * 0.06 * s, h.y - 0.19 * s); ctx.rotate(e * 0.2);
    ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, 0.036 * s, 0.11 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (detail) { ctx.fillStyle = '#f2a6b8'; ctx.beginPath(); ctx.ellipse(0, 0.01 * s, 0.017 * s, 0.075 * s, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  if (fx === 'lion') for (let i = 0; i < 16; i++) {   // 갈기
    const a = i / 16 * Math.PI * 2;
    ellipseAt({ x: h.x + Math.cos(a) * rx * 1.05, y: h.y + Math.sin(a) * ry * 1.05 }, 0.05 * s, 0.05 * s, deco(i % 2 ? '#b8692a' : '#cf8a3a'));
  }
  if (fx === 'bear' || fx === 'tiger' || fx === 'lion') for (const e of [-1, 1]) {   // 둥근 귀
    const p = { x: h.x + e * 0.095 * s, y: h.y - 0.088 * s }, r = (fx === 'lion' ? 0.036 : fx === 'tiger' ? 0.044 : 0.05) * s;
    ellipseAt(p, r, r, c);
    if (detail && fx === 'bear') ellipseAt({ x: p.x - e * 0.008 * s, y: p.y + 0.006 * s }, r * 0.5, r * 0.5, '#a8744a');
    if (detail && fx === 'tiger') {   // 호랑이 귀 뒤에는 흰 점이 있다
      ctx.lineWidth = Math.max(1, 0.008 * s); ctx.strokeStyle = '#1d1410'; ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.9, 0, Math.PI * 2); ctx.stroke();
      ellipseAt({ x: p.x, y: p.y + 0.004 * s }, r * 0.42, r * 0.42, '#ffffff');
    }
  }
  if (fx === 'dino') for (let i = 0; i < 5; i++) {   // 머리 위 가시
    const a = (-150 + i * 30) * DEG, ca = Math.cos(a), sa = Math.sin(a), bw = 0.032 * s;
    const base = { x: h.x + ca * rx * 0.88, y: h.y + sa * ry * 0.88 }, tip = { x: h.x + ca * (rx + 0.075 * s), y: h.y + sa * (ry + 0.075 * s) };
    ctx.fillStyle = deco('#f0a830'); ctx.beginPath();
    ctx.moveTo(base.x + sa * bw, base.y - ca * bw); ctx.lineTo(tip.x, tip.y); ctx.lineTo(base.x - sa * bw, base.y + ca * bw);
    ctx.closePath(); ctx.fill();
  }
  if (brim) ellipseAt(brim, 0.1 * brim.s, 0.035 * brim.s, c);
  ellipseAt(h, rx, ry, c);
  if (!detail) return;
  if (fx === 'tiger' || fx === 'turtle' || fx === 'dino') {
    ctx.save(); ctx.beginPath(); ctx.ellipse(h.x, h.y, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
    if (fx === 'tiger') {   // 양옆에서 들어오는 줄무늬와 정수리 줄무늬
      for (const e of [-1, 1]) for (const yo of [-0.06, 0, 0.06]) segment({ x: h.x + e * rx, y: h.y + yo * s }, { x: h.x + e * rx * 0.42, y: h.y + (yo + 0.012) * s }, 0.026 * s, 0.004 * s, '#1d1410');
      for (const e of [-1, 1]) segment({ x: h.x + e * 0.03 * s, y: h.y - ry }, { x: h.x + e * 0.018 * s, y: h.y - ry * 0.5 }, 0.022 * s, 0.004 * s, '#1d1410');
    } else if (fx === 'turtle') {   // 등딱지: 가운데 육각형과 바깥으로 뻗는 금
      const cx = h.x, cy = h.y - 0.01 * s, R = 0.055 * s, vs = Array.from({ length: 6 }, (_, i) => ({ x: cx + Math.cos((i * 60 + 30) * DEG) * R, y: cy + Math.sin((i * 60 + 30) * DEG) * R }));
      ctx.lineWidth = Math.max(1, 0.012 * s); ctx.strokeStyle = '#24502a';
      ctx.beginPath(); vs.forEach((v, i) => (i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y))); ctx.closePath();
      ctx.fillStyle = '#76b65f'; ctx.fill(); ctx.stroke();
      for (const v of vs) { ctx.beginPath(); ctx.moveTo(v.x, v.y); ctx.lineTo(cx + (v.x - cx) * 4, cy + (v.y - cy) * 4); ctx.stroke(); }
    } else {   // 공룡: 밝은 점무늬
      for (const [x, y, r] of [[-0.05, 0.02, 0.022], [0.045, -0.03, 0.018], [0.02, 0.06, 0.015]]) ellipseAt({ x: h.x + x * s, y: h.y + y * s }, r * s, r * s, '#8fd27a');
    }
    ctx.restore();
  }
  ellipseAt({ x: h.x - side * 0.04 * s, y: h.y - 0.06 * s }, 0.045 * s, 0.025 * s, 'rgba(255,255,255,0.28)');
}

// 신발: f는 발(화면), s는 발 자리에서 1m가 몇 px인지, front는 발끝 쪽(+1이면 화면 오른쪽)
function drawShoe(f, s, front, col, fx, detail) {
  const c = col('shoe'), x = f.x + front * 0.05 * s, y = f.y;
  if (!fx) { ellipseAt({ x, y }, 0.12 * s, 0.045 * s, c); return; }
  if (fx === 'duck') {   // 오리발: 발끝으로 넓어지는 긴 물갈퀴, 끝은 물결 모양
    const hx = x - front * 0.07 * s, tx = x + front * 0.16 * s;
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(hx, y - 0.035 * s);
    ctx.quadraticCurveTo(x, y - 0.045 * s, tx, y - 0.05 * s);
    for (let i = 0; i < 3; i++) { const y0 = y - 0.05 * s + i * 0.033 * s; ctx.quadraticCurveTo(tx + front * 0.028 * s, y0 + 0.0165 * s, tx, y0 + 0.033 * s); }
    ctx.quadraticCurveTo(x, y + 0.05 * s, hx, y + 0.035 * s);
    ctx.quadraticCurveTo(hx - front * 0.03 * s, y, hx, y - 0.035 * s);
    ctx.closePath(); ctx.fill();
    if (detail) {
      ctx.strokeStyle = '#c9700f'; ctx.lineWidth = Math.max(1, 0.008 * s);
      for (const yo of [-0.017, 0.016]) { ctx.beginPath(); ctx.moveTo(x - front * 0.02 * s, y); ctx.lineTo(tx - front * 0.005 * s, y + yo * s); ctx.stroke(); }
    }
    return;
  }
  const rx = 0.13 * s, ry = (fx === 'rabbit' ? 0.06 : 0.055) * s;
  if (fx === 'rabbit') for (const [xo, tilt] of [[0.025, -0.15], [0.065, 0.25]]) {   // 발등에 선 작은 귀
    ctx.save(); ctx.translate(x + front * xo * s, y - ry * 1.2); ctx.rotate(front * tilt);
    ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, 0.016 * s, 0.042 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (detail) { ctx.fillStyle = '#f2a6b8'; ctx.beginPath(); ctx.ellipse(0, 0.004 * s, 0.007 * s, 0.028 * s, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  if (fx === 'dino' && detail) for (const yo of [-0.03, 0, 0.03]) {   // 하얀 발톱 셋
    const bx = x + front * rx * 0.85, by = y + yo * s;
    ctx.fillStyle = '#f4f1e6'; ctx.beginPath(); ctx.moveTo(bx, by - 0.012 * s); ctx.lineTo(bx + front * 0.045 * s, by); ctx.lineTo(bx, by + 0.012 * s); ctx.closePath(); ctx.fill();
  }
  ellipseAt({ x, y }, rx, ry, c);
  if (!detail) return;
  if (fx === 'bear' || fx === 'tiger') {   // 발끝 위쪽의 발가락 셋
    for (const a of [-62, -32, -2]) ellipseAt({ x: x + front * Math.cos(a * DEG) * rx * 0.8, y: y + Math.sin(a * DEG) * ry * 0.75 }, 0.021 * s, 0.021 * s, fx === 'bear' ? '#a3714a' : '#f6efe4');
    if (fx === 'tiger') for (const xo of [-0.06, -0.015]) segment({ x: x + front * xo * s, y: y - ry * 0.95 }, { x: x + front * (xo - 0.006) * s, y: y + ry * 0.1 }, 0.018 * s, 0.004 * s, '#1d1410');
  } else if (fx === 'rabbit') ellipseAt({ x: x + front * rx * 0.9, y: y - 0.006 * s }, 0.013 * s, 0.011 * s, '#f28aa3');   // 분홍 코
}

// 한 번은 빛 테두리 색으로 조금 위에, 한 번은 제 색으로 그려서 조명을 등진 윤곽을 만든다
function drawBatterFigure(k, col, dy) {
  // 뼈대는 우타 기준으로 만들고, 좌타는 그릴 때 좌우만 뒤집는다
  const P = (p) => { const q = k.world ? project(p[0], p[1], p[2]) : batterPoint(p); return q ? { x: q.x, y: q.y + dy, s: q.s } : null; };   // 주자는 화면 기준 좌표
  const seg = (a, b, wa, wb, c) => { const pa = P(a), pb = P(b); if (pa && pb) segment(pa, pb, wa * pa.s, wb * pb.s, col(c)); };
  const ring = (c, l, f, rw, rd, y) => Array.from({ length: 12 }, (_, i) => {
    const a = i / 12 * Math.PI * 2;
    return P(V.add(V.add(c, [0, y, 0]), V.add(V.mul(l, rw * Math.cos(a)), V.mul(f, rd * Math.sin(a)))));
  });
  const { lc, fc, lp, fp } = k.axes ?? { lc: k.left(k.shTurn), fc: k.facing(k.shTurn), lp: k.left(k.hipTurn), fp: k.facing(k.hipTurn) };   // 동작을 섞을 때는 axes로 받는다
  const look = k.plain ? {} : currentLook(), detail = dy === 0;   // 투수(plain)에게는 상점 물건을 입히지 않는다
  const parts = [];
  for (const side of ['l', 'r']) {
    const other = side === 'l' ? 'r' : 'l', far = k.world ? k.shoulders[side][2] > k.shoulders[other][2] : side === 'l';   // 카메라에서 먼 쪽 팔다리는 조금 어둡다(타자는 왼쪽)
    parts.push({ depth: k.knees[side][2], draw: () => {
      const ankle = V.add(k.knees[side], V.mul(V.sub(k.feet[side], k.knees[side]), 0.62));   // 긴 바지 아래로 양말(보조색)이 조금 보인다
      seg(k.hips[side], k.knees[side], 0.19, 0.13, far ? 'pantsShade' : 'pants');
      seg(k.knees[side], ankle, 0.13, 0.1, far ? 'pantsShade' : 'pants');
      seg(ankle, k.feet[side], 0.09, 0.08, 'accent');
      const f = P(k.feet[side]);
      if (f) drawShoe(f, f.s, k.front ?? batSide(), col, fxOf(look.shoe), detail);
      if (f && detail && k.soles?.[side] > 0.05) ellipseAt({ x: f.x, y: f.y - 0.03 * f.s }, 0.055 * f.s, 0.1 * f.s, `rgba(232,228,218,${(0.95 * k.soles[side]).toFixed(2)})`);   // 차올린 발의 밑창(발끝이 아래로 선 세로 모양)
    } });
    parts.push({ depth: k.elbows[side][2], draw: () => {
      const hand = k.hands?.[side] ?? k.hand;   // 주자는 손이 둘이다
      seg(k.shoulders[side], k.elbows[side], 0.12, 0.095, far ? 'shade' : 'jersey');
      seg(k.elbows[side], hand, 0.09, 0.07, 'sleeve');
      const hp = k.hands ? P(hand) : null;
      if (hp && k.mitt === side) {   // 투수의 글러브
        ellipseAt(hp, 0.1 * hp.s, 0.115 * hp.s, col('glove'));
        if (detail) ellipseAt({ x: hp.x, y: hp.y + 0.02 * hp.s }, 0.05 * hp.s, 0.065 * hp.s, col('pocket'));
      } else if (hp) {
        ellipseAt(hp, 0.045 * hp.s, 0.045 * hp.s, col(k.bare ? 'skin' : 'glove'));
        if (detail && k.ball === side) ellipseAt({ x: hp.x, y: hp.y - 0.03 * hp.s }, 0.045 * hp.s, 0.045 * hp.s, '#ffffff');
      }
    } });
  }
  parts.push({ depth: k.chest[2], draw: () => {
    const jersey = hull([...ring(k.chest, lc, fc, 0.21, 0.12, 0), ...ring(k.chest, lc, fc, 0.13, 0.09, 0.07), ...ring(k.pelvis, lp, fp, 0.16, 0.11, 0.1)]);
    smoothShape(jersey, col('jersey'));
    smoothShape(hull([...ring(k.pelvis, lp, fp, 0.165, 0.115, 0.1), ...ring(k.pelvis, lp, fp, 0.15, 0.11, -0.06)]), col('pants'));
    smoothShape(hull([...ring(k.pelvis, lp, fp, 0.167, 0.117, 0.115), ...ring(k.pelvis, lp, fp, 0.167, 0.117, 0.085)]), col('belt'));
    if (detail && !k.plain) drawBackNumber(k, P, col, jersey);
    seg(V.add(k.chest, [0.02, 0.05, 0]), V.add(k.head, [0, -0.08, 0]), 0.1, 0.09, 'skin');
    // 헬멧: 챙은 투수 쪽을 향해 머리 뒤로 조금만 보인다
    const h = P(k.head);
    if (h && k.cap) drawCapHead(h, P(k.brim), col, detail);
    else if (h) drawHelmet(h, h.s, P(k.brim ?? V.add(k.head, [0.03, -0.04, 0.12])), col, fxOf(look.helmet), detail, k.side ?? batSide());
  } });
  if (!k.noBat) parts.push({ depth: Math.min(k.hand[2], k.tip[2]) - 0.01, draw: () => {
    const hp = P(k.hand), tp = P(k.tip), h2 = P(V.add(k.hand, V.mul(V.sub(k.tip, k.hand), 0.1)));
    if (!hp || !tp) return;
    drawBat(hp, tp, 0.034 * hp.s, 0.068 * tp.s, tp.s, col, fxOf(look.bat), detail);
    ellipseAt(hp, 0.05 * hp.s, 0.05 * hp.s, col('glove'));
    if (h2) ellipseAt(h2, 0.05 * h2.s, 0.05 * h2.s, col('glove'));
  } });
  parts.sort((a, b) => b.depth - a.depth).forEach((p) => p.draw());
}

const SWING_GLOW = { fire: '255,140,50', lightning: '120,200,255', ice: '200,240,255' };
function drawBatter(tau, pre = null) {
  const k = batterSkeleton(tau, pre);
  // 스윙 잔상: 누른 순간을 맞는 순간으로 보여 줘서 방망이가 한 장면 만에 맞는 자리로 간다. 당긴 자리(-110도)부터 지금까지 지나간 자국을
  // 진하게 남겨 휘두른 것처럼 보이게 한다(2026-11-02 전에는 -80도부터 옅게 그렸다)
  if (tau != null && tau < 0.18) {
    const band = [];
    const m = batSide();
    const hx = k.hand[0] + batterShift();
    for (let a = -110; a <= k.yaw; a += 8) band.push([m * (hx + BAT_LEN * Math.cos(a * DEG)), k.hand[2] + BAT_LEN * Math.sin(a * DEG), 0.98]);
    for (let a = k.yaw; a >= -110; a -= 8) band.push([m * (hx + 0.3 * Math.cos(a * DEG)), k.hand[2] + 0.3 * Math.sin(a * DEG), 1.0]);
    const rgb = SWING_GLOW[fxOf(currentLook().bat)];   // 불꽃·번개·얼음 배트는 잔상도 그 색으로 남는다
    if (band.length > 2) fill3d(band, `rgba(${rgb ?? '255,255,255'},${(rgb ? 0.48 : 0.34) * (1 - tau / 0.18)})`);
  }
  drawBatterFigure(k, () => BATTER_COLOR.rim, -2);
  const C = batterColors();
  drawBatterFigure(k, (name) => C[name], 0);
}

// 타자의 준비 동작(2026-11-02): 투수가 공을 놓으면(공 시각 0) 공이 반쯤 올 때까지 손을 당기고 앞발을 내디딘다.
