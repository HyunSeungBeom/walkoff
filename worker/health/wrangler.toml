# 상태 알림 Worker(2026-11-20 사용자 'Cloudflare 예약 실행', 작업 글 walkoff-health-cron.md). 5분마다 게임 두 주소와 랭킹 서버를 보고(src/checks.js, scripts/health.js와 같은 판정)
# 25초 뒤 다시 봐도 실패면 메일을 보낸다. 운영 서버(../wrangler.toml의 walkoff-api)와 따로 둔다: 서버 배포가 깨져도 감시는 살아 있게.
# 이 폴더에서 WRANGLER_SEND_METRICS=false ../node_modules/.bin/wrangler deploy 로 올린다. GitHub의 health.yml은 두 번째 감시로 그대로 둔다
name = "walkoff-health"
main = "src/index.js"
compatibility_date = "2026-10-01"
# 같은 계정의 서버(workers.dev)도 바깥 사람처럼 연다(같은 곳의 Worker끼리 부르면 나는 오류 1042를 피하고, 사람이 여는 길과 같게)
compatibility_flags = ["global_fetch_strictly_public"]
# 주소 없이 예약 실행만 한다. 밖에서 불러 메일을 보내게 할 수 없다
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/5 * * * *"]

# 지난 상태 한 덩어리('state'). 바뀐 바퀴에만 쓴다(무료 하루 쓰기 1,000번이고, 5분마다 바뀌어도 288번)
[[kv_namespaces]]
binding = "STATE"
id = "a9217f38ceab4a09b13e8a142e432768"   # 2026-11-23 wrangler kv namespace create walkoff-health로 만든 저장소

# 메일(Email Routing). 받는 주소는 비밀값 ALERT_TO이고, Email Routing에서 Verified인 주소에만 간다(Verified 주소로 보내는 것은 모든 플랜에서 무료).
# 공개 레포라 destination_address·allowed_destination_addresses에 메일을 적지 않는다(안 적으면 Verified 주소에만 보낼 수 있다)
[[send_email]]
name = "MAIL"
allowed_sender_addresses = ["alerts@walkoff.kr"]

# 로그(Workers Logs): 바퀴마다 결과 한 줄과 못 보낸 메일 줄. 사람 정보는 없고 메일 주소는 가린다(src/mail.js hideMail).
# 무료는 하루 20만 줄·3일 보관이고 하루 600줄쯤 쓴다. 2026-12-01부터 Cloudflare Observability 요금으로 바뀌어 그 전에 서버와 같이 다시 본다
[observability]
enabled = true
