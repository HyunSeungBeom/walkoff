# walkoff 랭킹 서버. worker 폴더에서 npm run deploy로 올린다
name = "walkoff-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "walkoff"
database_id = "2fe2c53b-2747-4af6-a360-b4359142e066"   # 2026-10-28 npx wrangler d1 create walkoff(APAC)로 만든 저장소

# 로그인 없이 받는 요청의 횟수 제한(2026-11-05, 2026-11-02 보안 점검에서 남은 것). IP마다 1분에 limit번(index.js LIMITERS).
# Cloudflare 위치마다 따로 세고 대략 맞다. 무료 플랜의 한국 요청은 미국 두 곳(LAX·SJC)으로 나뉘어 실제로는 두 배쯤에서 걸린다(2026-11-18 실서버 시험).
# 랭킹 60번은 사용자 결정(평일 낮 같은 회사 와이파이에서 여럿이 쳐도 안 막게, 초당 수십 번 장난은 막는다).
# 통계는 2026-11-18 사용자 결정으로 30번(묶음 하나가 DB에 여러 줄을 써서. 기기마다 1분 1~2번이라 같은 와이파이 15~30명까지 안 막는다)
[[ratelimits]]
name = "EVENTS_LIMIT"
namespace_id = "1101"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RANKINGS_LIMIT"
namespace_id = "1102"
simple = { limit = 60, period = 60 }

# 선물 받는 사람 찾기(2026-11-10, /players). 로그인한 사람만 쓰고 계정마다 1분에 30번(사람이 찾기에는 넉넉하고, 닉네임을 훑는 장난은 막는다)
[[ratelimits]]
name = "PLAYERS_LIMIT"
namespace_id = "1103"
simple = { limit = 30, period = 60 }

# 시드 표(2026-11-18 서명한 표, src/seeds.js). 표를 DB에 적지 않아 한 시간 300장 상한을 계정마다 1분 20장으로 옮겼다.
# 판을 빨리 다시 시작해도(와인드업만 1.5초) 1분 20번은 넘기 어렵고, 표를 많이 받아 좋은 공을 고르는 장난은 계속 막는다
[[ratelimits]]
name = "SEEDS_LIMIT"
namespace_id = "1104"
simple = { limit = 20, period = 60 }
